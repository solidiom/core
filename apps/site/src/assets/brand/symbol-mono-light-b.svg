<svg xmlns="http://www.w3.org/2000/svg" width="129" height="168" viewBox="0 0 129 168" fill="none" role="img" aria-labelledby="solidiom-symbol-mono-light-b-title">
  <title id="solidiom-symbol-mono-light-b-title">Solidiom</title>
  <!--
    Dark-mode mark, VERSION B: single-ink brand indigo.
    Same one-colour treatment as version A, but tinted with the dark-mode
    primary token instead of neutral canvas, so the mark carries brand
    colour on dark surfaces rather than reading as plain white.
    Ink: #8B83F8 (primary, dark-mode variant), 5.70:1 on the dark canvas.
  -->
  <g fill="#8B83F8">
    <path d="M60 0H46a46 46 0 0 0 0 92h14z"/>
    <rect x="69" y="0" width="60" height="60"/>
    <rect x="0" y="108" width="60" height="60"/>
    <path d="M69 76h14a46 46 0 0 1 0 92H69z"/>
  </g>
</svg>
