<svg xmlns="http://www.w3.org/2000/svg" width="129" height="168" viewBox="0 0 129 168" fill="none" role="img" aria-labelledby="solidiom-symbol-mono-dark-title">
  <title id="solidiom-symbol-mono-dark-title">Solidiom</title>
  <!--
    Monochrome dark variant of symbol.svg, for light backgrounds where the
    brand palette cannot be used (single-colour print, engraving, etching).
    Geometry is identical to symbol.svg; only the fills collapse to one ink.
    The 9-unit gutter is what keeps the four tiles readable as separate
    shapes once colour is removed — do not close it.
    Ink: #0F172A (surface-inverse).
  -->
  <g fill="#0F172A">
    <path d="M60 0H46a46 46 0 0 0 0 92h14z"/>
    <rect x="69" y="0" width="60" height="60"/>
    <rect x="0" y="108" width="60" height="60"/>
    <path d="M69 76h14a46 46 0 0 1 0 92H69z"/>
  </g>
</svg>
