<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-labelledby="solidiom-symbol-mono-dark-title">
  <title id="solidiom-symbol-mono-dark-title">Solidiom</title>
  <!--
    Monochrome dark variant of the Bracket S mark, for use on light
    backgrounds where the brand color cannot be used (single-color print,
    embossing, low-contrast contexts). Uses Slate 950 (0F172A) from the
    canonical neutral palette, not pure black.
  -->
  <path
    d="M 68 18
       C 50 18, 36 28, 36 42
       C 36 54, 46 58, 58 60"
    fill="none"
    stroke="#0F172A"
    stroke-width="11"
    stroke-linecap="round"
  />
  <path
    d="M 32 82
       C 50 82, 64 72, 64 58
       C 64 46, 54 42, 42 40"
    fill="none"
    stroke="#0F172A"
    stroke-width="11"
    stroke-linecap="round"
  />
</svg>
