<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-labelledby="solidiom-symbol-mono-light-title">
  <title id="solidiom-symbol-mono-light-title">Solidiom</title>
  <!--
    Monochrome light variant of the Bracket S mark, for use on dark
    or brand-colored backgrounds. Uses Canvas (F8FAFC) from the
    canonical neutral palette, not pure white.
  -->
