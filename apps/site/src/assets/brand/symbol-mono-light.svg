<svg xmlns="http://www.w3.org/2000/svg" width="129" height="168" viewBox="0 0 129 168" fill="none" role="img" aria-labelledby="solidiom-symbol-mono-light-title">
  <title id="solidiom-symbol-mono-light-title">Solidiom</title>
  <!--
    Monochrome light variant of symbol.svg, for dark or brand-coloured
    backgrounds. This is the correct variant whenever the mark sits on a
    dark surface — the full-colour version's dark tile drops to 1.08:1
    against the dark canvas and disappears.
    Geometry is identical to symbol.svg; only the fills collapse to one ink.
    Ink: #F8FAFC (canvas).
  -->
  <g fill="#F8FAFC">
    <path d="M60 0H46a46 46 0 0 0 0 92h14z"/>
    <rect x="69" y="0" width="60" height="60"/>
    <rect x="0" y="108" width="60" height="60"/>
    <path d="M69 76h14a46 46 0 0 1 0 92H69z"/>
  </g>
</svg>
