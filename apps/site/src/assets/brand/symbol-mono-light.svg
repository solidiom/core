    d="M 68 18
       C 50 18, 36 28, 36 42
       C 36 54, 46 58, 58 60"
    fill="none"
    stroke="#F8FAFC"
    stroke-width="11"
    stroke-linecap="round"
  />
  <path
    d="M 32 82
       C 50 82, 64 72, 64 58
       C 64 46, 54 42, 42 40"
    fill="none"
    stroke="#F8FAFC"
    stroke-width="11"
    stroke-linecap="round"
  />
</svg>
