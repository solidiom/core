<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100" fill="none" role="img" aria-labelledby="solidiom-wordmark-title">
  <title id="solidiom-wordmark-title">Solidiom</title>
  <!--
    Primary horizontal lockup: symbol + lowercase wordmark ("solidiom").

    The quadrant symbol is portrait, so it is scaled to 76 units tall and
    optically centred in the 100-unit band rather than filling it:
    s = 76/168 => 58.36 x 76, placed at y (100 - 76) / 2 = 12.
    The word then starts at x 86, leaving a 28-unit gap after the symbol.

    Set in Inter Tight (display face). This source file references the font
    by family name for design-tool editing; convert the text to outlined
    paths before exporting any raster or print artifact so rendering does
    not depend on font availability on the consuming system.
  -->
