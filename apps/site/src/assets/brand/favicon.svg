<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none" role="img" aria-labelledby="solidiom-favicon-title">
  <title id="solidiom-favicon-title">Solidiom</title>
  <!--
    Favicon source, derived from symbol-small.svg (wide-gutter geometry).

    The quadrant mark is portrait (132 x 168 here), but favicons are square,
    so the mark is centred on a square canvas with padding rather than
    scaled to fill. Background is left transparent so the icon adopts the
    browser's tab colour.

    Fit: mark scaled to 88 units tall (s = 88/168) => 69.14 x 88,
    centred at x (100 - 69.14) / 2 = 15.43, y (100 - 88) / 2 = 6.
  -->
  <g transform="translate(15.43 6) scale(0.52381)">
    <path d="M60 0H46a46 46 0 0 0 0 92h14z" fill="#0F172A"/>
    <rect x="72" y="0" width="60" height="60" fill="#5750D6"/>
    <rect x="0" y="108" width="60" height="60" fill="#CBD5E1"/>
    <path d="M72 76h14a46 46 0 0 1 0 92H72z" fill="#06B6D4"/>
  </g>
</svg>
