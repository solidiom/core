<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" fill="none" role="img" aria-labelledby="title">
  <title id="title">Solidiom</title>
  <!--
    Generated from apps/site/src/assets/brand/symbol.svg, on a rounded-square
    backing surface for maskable PWA icon use.

    The quadrant mark is portrait (129 x 168) where the previous mark was
    square, so it is centred with padding rather than scaled to fill.
    Fit: mark scaled to 112 units tall (s = 112/168 = 2/3) => 86 x 112,
    centred at x (192 - 86) / 2 = 53, y (192 - 112) / 2 = 40. This keeps the
    mark inside the ~80% safe area that Android maskable icons crop to.

    The monochrome-light variant is used because the plate is a saturated
    brand colour — the full-colour mark's dark tile would not read on it.
    Plate: #5750D6 (sol-primary). Ink: #F8FAFC (canvas), 5.7:1 on the plate.
  -->
  <rect width="192" height="192" rx="40" fill="#5750D6"/>
  <g transform="translate(53 40) scale(0.666667)" fill="#F8FAFC">
    <path d="M60 0H46a46 46 0 0 0 0 92h14z"/>
    <rect x="69" y="0" width="60" height="60"/>
    <rect x="0" y="108" width="60" height="60"/>
    <path d="M69 76h14a46 46 0 0 1 0 92H69z"/>
  </g>
</svg>
