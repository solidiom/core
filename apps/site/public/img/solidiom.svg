<svg xmlns="http://www.w3.org/2000/svg" width="129" height="168" viewBox="0 0 129 168" fill="none" role="img" aria-labelledby="solidiom-symbol-title">
  <title id="solidiom-symbol-title">Solidiom</title>
  <!--
    Quadrant mark. Four tiles on a two-column grid: two squares and two
    half-rounds, each half-round facing away from the centre. The
    composition is an exact 180-degree rotation about (64.5, 84) — every
    tile maps onto its diagonal opposite.

    Grid (viewBox units):
      columns  : left x 0..60, right x 69..129   (60 wide, 9 gutter)
      dark     top-left  half-round: rect x 46..60, y 0..92   + semicircle r=46 facing left
      primary  top-right square: 60 x 60 at (69, 0)
      border   bottom-left square: 60 x 60 at (0, 108)
      accent   bottom-right half-round: rect x 69..83, y 76..168 + semicircle r=46 facing right

    Each half-round is a rectangle whose outer edge is a true semicircle
    (radius = half the shape's height) written as one SVG arc, so curves
    stay exact at any size. Do not re-trace this mark from a raster export.

    Colours are the sol- token palette (apps/site/src/assets/tokens.css):
      #0F172A surface-inverse | #5750D6 primary | #CBD5E1 border | #06B6D4 accent
  -->
  <path d="M60 0H46a46 46 0 0 0 0 92h14z" fill="#0F172A"/>
  <rect x="69" y="0" width="60" height="60" fill="#5750D6"/>
  <rect x="0" y="108" width="60" height="60" fill="#CBD5E1"/>
  <path d="M69 76h14a46 46 0 0 1 0 92H69z" fill="#06B6D4"/>
</svg>
