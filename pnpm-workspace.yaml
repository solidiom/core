packages:
  - "packages/*"
  - "apps/*"
  - "registry/*"
  - "tests/*"
  - "tools/*"
  - "templates/*"

catalog:
  solid-js: "^2.0.0-beta.23"
  "@solidjs/web": "^2.0.0-beta.23"
  babel-preset-solid: "^2.0.0-beta.23"

overrides:
  solid-js: "2.0.0-beta.26"
  "@solidjs/web": "2.0.0-beta.26"
  babel-preset-solid: "2.0.0-beta.26"

peerDependencyRules:
  allowAny:
    - "solid-js"
    - "@solidjs/web"
    - "babel-preset-solid"

onlyBuiltDependencies:
  - "esbuild"
  - "nx"
