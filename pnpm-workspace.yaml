packages:
  - "packages/*"
  - "apps/*"
  - "registry/*"
  - "tests/*"
  - "tools/*"
  - "templates/*"

catalog:
  solid-js: ">=2.0.0-rc.1 <3.0.0"
  "@solidjs/web": ">=2.0.0-rc.1 <3.0.0"
  babel-preset-solid: ">=2.0.0-rc.1 <3.0.0"

overrides:
  solid-js: "2.0.0-rc.1"
  "@solidjs/web": "2.0.0-rc.1"
  babel-preset-solid: "2.0.0-rc.1"
  # Security overrides for transitive dependencies. Each target is bounded to the
  # existing major so a floor never becomes an accidental major upgrade.
  # ip-address     GHSA-mwp4-54f8-5fhr / -4xrf-jv44-h6hh / -22jq-vg5j-6vgg (via socks@2, declares ^10.1.1)
  # brace-expansion GHSA-rgw5-rvv9-x895 (vulnerable < 5.0.9; via minimatch@10, declares ^5.0.5)
  # nanoid/js-yaml/postcss: regression floors — dedupe already resolves these correctly.
  "ip-address@10": "^10.5.0"
  "brace-expansion@5": "^5.0.9"
  "nanoid@3": "^3.3.18"
  "js-yaml@4": "^4.3.1"
  "postcss@8": "^8.5.26"
  # esbuild GHSA-g7r4-m6w7-qqqr (vulnerable >=0.27.3 <0.28.1). Held at 0.27.7 by
  # tsup@8.5.1, bundle-require@5.1.0 and one vite@8.2.2 variant. tsup declares
  # esbuild ^0.27.0, so this override deliberately exceeds its declared range;
  # tsup only calls esbuild.build/transform/formatMessages (verified against its
  # dist) and never the serve API the advisory concerns, and package builds are
  # verified green on 0.28.x.
  "esbuild@0.27": "^0.28.2"

peerDependencyRules:
  allowAny:
    - "solid-js"
    - "@solidjs/web"
    - "babel-preset-solid"

onlyBuiltDependencies:
  - "esbuild"
  - "nx"
