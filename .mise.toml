[tools]
node = "latest"
pnpm = "latest"
gh = "latest"
# CLI-008 smoke matrix drives all four package managers. CI gets yarn from
# `corepack enable` and bun from oven-sh/setup-bun@v2 (pinned 1.3.14); mise
# provides both directly here because `npm:corepack` is in MISE_DISABLE_TOOLS
# below. Versions match ci.yml and run-offline-test.sh's `packageManager` pin.
yarn = "1.22.22"
bun = "1.3.14"

[env]
# Prevent global mise npm tools from auto-installing in this workspace.
# They conflict with workspace-local deps managed by pnpm (EEXIST link errors).
MISE_DISABLE_TOOLS = "npm:opencode-ai,npm:opencode-codebase-index,npm:playwright,npm:slides-grab,npm:@openai/codex,npm:@playwright/cli,npm:@storybook/addon-mcp,npm:@bitbonsai/mcpvault,npm:@swarmvaultai/cli,npm:corepack,npm:typescript,npm:tsx,npm:rimraf"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[tasks.build]
description = "Build all packages (respects nx dep graph)"
run = "pnpm nx run-many -t build"

[tasks."build:package"]
description = "Build a single package  →  mise run build:package -- @solidiom/button"
run = "pnpm nx build {{arg(name='package')}}"

[tasks."build:recipes"]
description = "Build both recipe packages"
run = "pnpm nx run-many -t build --projects=@solidiom/recipes-css,@solidiom/recipes-tailwind"

[tasks."build:site"]
description = "Build the Solidiom website (apps/site)"
run = "pnpm nx build @solidiom/site"

[tasks."validate:site"]
description = "Validate the website (Astro check, production build, and Pagefind index)"
run = [
  "pnpm exec nx run @solidiom/site:check",
  "pnpm exec nx run @solidiom/site:build",
  "pnpm exec nx run @solidiom/site:search-index",
]

[tasks."build:registry"]
description = "Generate registry manifests (registry/*.json)"
run = "pnpm tsx tools/registry-build.ts"

# ---------------------------------------------------------------------------
# Dev
# ---------------------------------------------------------------------------

[tasks.dev]
description = "Start the Solidiom website dev server"
run = "pnpm --filter @solidiom/site exec astro dev --host 0.0.0.0 --force"

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------

[tasks.test]
description = "Run all unit tests (node mode)"
run = "pnpm nx run-many -t test"

[tasks."test:unit"]
description = "Run vitest unit tests directly (no nx)"
run = "pnpm vitest run --config vitest.config.ts"

[tasks."test:browser"]
description = "Run browser-mode component tests via Playwright"
run = "pnpm vitest run --config vitest.browser.config.ts"

[tasks."test:e2e"]
description = "Run Playwright end-to-end tests"
run = "pnpm playwright test --config tests/e2e/playwright.config.ts"

[tasks."test:all"]
description = "Run all test surfaces (unit + browser + e2e)"
run = [
  "mise run test",
  "mise run test:browser",
  "mise run test:e2e",
]

[tasks."test:package"]
description = "Test a single package  →  mise run test:package -- @solidiom/button"
run = "pnpm nx test {{arg(name='package')}}"

[tasks."test:primitives"]
description = "Run tests for all primitive-layer packages"
run = "pnpm nx run-many -t test --projects='tag:layer:primitive'"

[tasks."typecheck:primitives"]
description = "Type-check all primitive-layer packages"
run = "pnpm nx run-many -t typecheck --projects='tag:layer:primitive'"

# ---------------------------------------------------------------------------
# Type-check & Lint
# ---------------------------------------------------------------------------

[tasks.typecheck]
description = "Type-check all packages"
run = "pnpm nx run-many -t typecheck"

[tasks.lint]
description = "Lint all packages"
run = "pnpm nx run-many -t lint"

[tasks."lint:fix"]
description = "Lint all packages and auto-fix"
run = "pnpm nx run-many -t lint -- --fix"

[tasks.format]
description = "Format all files with Prettier"
run = "pnpm prettier --write ."

[tasks."format:check"]
description = "Check formatting without writing"
run = "pnpm prettier --check ."

# ---------------------------------------------------------------------------
# Packaging / Release
# ---------------------------------------------------------------------------

[tasks.changeset]
description = "Create a new changeset"
run = "pnpm changeset"

[tasks.version]
description = "Apply pending changesets (bump versions + update changelogs)"
run = "pnpm changeset version"

[tasks.release]
description = "Build all packages then publish to npm"
depends = ["build"]
run = "pnpm changeset publish"

# ---------------------------------------------------------------------------
# Dependency graph
# ---------------------------------------------------------------------------

[tasks.graph]
description = "Open the nx project dependency graph in a browser"
run = "pnpm nx graph"

# ---------------------------------------------------------------------------
# Audit
# ---------------------------------------------------------------------------

[tasks.audit]
description = "Run the primitive normalization audit (JSX imports, JSDoc, tests)"
run = "pnpm tsx tools/audit-primitives.ts"

[tasks."audit:recipes"]
description = "Verify recipe CSS uses only semantic attribute selectors (no .class or #id)"
run = "pnpm tsx tools/audit-recipe-contract.ts"

# ---------------------------------------------------------------------------
# Acceptance gates (each runnable on its own)
# ---------------------------------------------------------------------------

[tasks."gate:phase0"]
description = "Run the Phase 0 acceptance gate"
run = "pnpm tsx tools/phase0-gate.ts"

[tasks."gate:phase1"]
description = "Run the Phase 1 acceptance gate"
run = "pnpm tsx tools/phase1-gate.ts"

[tasks."gate:phase2"]
description = "Run the Phase 2 acceptance gate"
run = "pnpm tsx tools/phase2-gate.ts"

[tasks."gate:phase3"]
description = "Run the Phase 3 acceptance gate (beta release)"
run = "pnpm tsx tools/phase3-gate.ts"

[tasks."gate:phase3-preflight"]
description = "Run the Phase 3 preflight (Solid 2 beta baseline)"
run = "pnpm tsx tools/phase3-preflight.ts"

# ---------------------------------------------------------------------------
# Accessibility
# ---------------------------------------------------------------------------

[tasks."a11y:scan"]
description = "Run executable axe accessibility scans"
run = "pnpm tsx tools/run-a11y.ts"

[tasks."a11y:evidence"]
description = "Publish stable per-primitive accessibility evidence from the executed axe artifact"
run = "pnpm tsx tools/a11y-evidence.ts"

[tasks."a11y:report"]
description = "Generate the axe report from the executed result artifact"
run = "pnpm tsx tools/generate-axe-report.ts"

# ---------------------------------------------------------------------------
# CI workflow — atomic steps (mirror .github/workflows/ci.yml jobs)
#
# One task per ci.yml job, in file order, running that job's distinctive
# commands. Deviations from the YAML for local use:
#
#   * `pnpm install --frozen-lockfile` is not repeated in every task; CI
#     repeats it because each job is a fresh runner. Run `ci:install` once.
#   * `playwright install` drops `--with-deps`, which only installs Linux apt
#     packages and fails on macOS.
#   * CI uploads/downloads build artifacts between jobs. Locally, tasks share
#     the same dist/ directories, so a single `ci:build` suffices.
#   * Gate jobs are consolidated into `ci:gates` (mirrors the single `gates`
#     job in ci.yml). Individual gate tasks still exist for targeted runs.
#   * The Solid compatibility matrix (solid-compat.yml) runs nightly in CI.
#     Use `ci:solid-matrix` to run it locally.
#
# Architecture (mirrors ci.yml):
#   install → format, typecheck, build, site-check
#   build   → test-node, test-browser, a11y-axe-scan, catalog-gates,
#             vertical-slice-gate, cli-smoke-create-prep → cli-smoke-create
#   site-check → site-build → site-e2e, site-visual, site-lighthouse,
#                              beta-acceptance-report, beta-acceptance-e2e
#   (all tests + a11y + site-e2e + catalog-gates) → gates (consolidated)
# ---------------------------------------------------------------------------

[tasks."ci:install"]
description = "CI job `install`: install workspace deps from the frozen lockfile"
run = "pnpm install --frozen-lockfile"

[tasks."ci:format"]
description = "CI job `format`: check formatting with Prettier"
run = "pnpm run format:check"

[tasks."ci:typecheck"]
description = "CI job `typecheck`: type-check all packages"
run = "pnpm typecheck"

[tasks."ci:build"]
description = "CI job `build`: build all packages (excluding site), then integrity/parity/provenance verification"
run = [
  "pnpm nx run-many -t build --exclude=@solidiom/site",
  # REG-006 — verify registry catalog integrity
  "node packages/cli/dist/bin.js verify --registry",
  # API-004 — verify vertical-slice primitive API coverage
  "pnpm run api:coverage-gate",
  # RECIPE-006 / CLI-001 — verify package src/source parity and exports
  "pnpm run audit:package-source-parity",
  # THEME-002/003/004 — verify generated theme output is current
  "pnpm run theme:emit:css:check",
  "pnpm run theme:emit:tailwind:check",
  "pnpm run theme:emit:unocss:check",
  # THEME-005 — theme cross-output parity, contrast, and round-trip audit
  "pnpm run audit:theme-parity",
  # PRESET-005 — cross-preset contrast, coverage, and translation gate
  "pnpm run audit:preset-themes",
  # CLI-003 — assert no unverified provenance lock entries
  "pnpm run assert:no-unverified",
  # Registry build (unsigned locally without REGISTRY_SIGN_KEY)
  "pnpm run registry:build",
]

[tasks."ci:test-node"]
description = "CI job `test-node`: unit + tools tests (needs a prior build; in CI this downloads build artifacts)"
env = { CI = "true" }
run = [
  "pnpm exec playwright install chromium",
  "pnpm test",
  "pnpm run test:tools",
]

[tasks."ci:test-browser"]
description = "CI job `test-browser`: browser-mode component tests plus RECIPE-005 computed-style parity (needs a prior build)"
env = { CI = "true" }
run = [
  "pnpm exec playwright install chromium firefox webkit",
  "pnpm exec vitest run --config vitest.browser.config.ts < /dev/null",
  # RECIPE-005 — computed-style parity across css/tailwind/unocss profiles
  "pnpm run test:recipe-parity",
]

[tasks."ci:solid-matrix"]
description = "Solid compat matrix (solid-compat.yml, nightly scheduled): Node 24/26 × low/mid/high tiers"
run = '''#!/usr/bin/env bash
set -euo pipefail
export CI=true

# This job mutates package.json/pnpm-lock.yaml per tier; restore them on exit
# so the task is self-contained and leaves the working tree unchanged. The
# final install also restores node_modules to the pinned Solid version, which
# matters locally where the next task shares this checkout.
tmp_dir="$(mktemp -d)"
cp package.json "$tmp_dir/package.json"
cp pnpm-lock.yaml "$tmp_dir/pnpm-lock.yaml"
trap 'cp "$tmp_dir/package.json" package.json; cp "$tmp_dir/pnpm-lock.yaml" pnpm-lock.yaml; rm -rf "$tmp_dir"; pnpm install --frozen-lockfile' EXIT

for node_version in 24 26; do
  for solid_tier in low mid high; do
    echo "==> Solid matrix: Node ${node_version}, Solid ${solid_tier}"
    mise exec "node@${node_version}" -- node scripts/set-solid-version.mjs "$solid_tier"
    mise exec "node@${node_version}" -- pnpm install --no-frozen-lockfile
    mise exec "node@${node_version}" -- pnpm exec playwright install chromium firefox webkit
    mise exec "node@${node_version}" -- pnpm exec nx run-many -t build --exclude=@solidiom/site
    mise exec "node@${node_version}" -- pnpm exec nx run-many -t test --exclude=@solidiom/tests-package-source-parity,@solidiom/site < /dev/null
    mise exec "node@${node_version}" -- pnpm exec vitest run --config vitest.browser.config.ts < /dev/null
  done
done
'''

[tasks."ci:a11y-axe-scan"]
description = "CI job `a11y-axe-scan`: axe scans, evidence, A11Y-004 coverage gate, and report (needs a prior build)"
env = { CI = "true" }
run = [
  "pnpm exec playwright install chromium",
  "pnpm run test:a11y",
  # Remove existing evidence so report:a11y-evidence writes fresh provenance
  # matching the scan that just executed (withPreservedProvenance would otherwise
  # keep stale timestamps when substance is unchanged).
  "find packages -path '*/docs/accessibility/evidence.json' -delete",
  "pnpm run report:a11y-evidence",
  # A11Y-004 — verify GA-status primitive accessibility evidence is current
  "pnpm run a11y:coverage-gate",
  "pnpm run report:axe",
]

[tasks."ci:site-check"]
description = "CI job `site-check`: import boundaries and i18n route parity (astro check and translation freshness are pre-existing failures, tracked separately)"
run = [
  "pnpm --filter @solidiom/site run boundaries",
  "pnpm --filter @solidiom/site run route-parity",
  "pnpm --filter @solidiom/site run content:validate",
]

[tasks."ci:site-build"]
description = "CI job `site-build`: build the site (skipping translation gate) and Pagefind-index, then REG-007 route check"
run = [
  "pnpm --filter @solidiom/site run templates:sync",
  "pnpm --filter @solidiom/site run boundaries",
  "pnpm --filter @solidiom/site exec astro build",
  "pnpm --filter @solidiom/site search-index",
  # REG-007 — verify every registry deliverable has exactly one valid route
  "pnpm --filter @solidiom/site run registry-route-check",
]

[tasks."ci:site-e2e"]
description = "CI job `site-e2e`: site Playwright E2E against the built dist (run ci:site-build first)"
env = { PLAYWRIGHT_USE_EXISTING_BUILD = "1", CI = "true" }
run = [
  "pnpm exec playwright install chromium firefox webkit",
  "pnpm --filter @solidiom/site run test:e2e",
]

[tasks."ci:site-visual"]
description = "CI job `site-visual`: visual baselines against the built dist — ADVISORY, mirrors continue-on-error (run ci:site-build first; baselines are Linux-generated, so expect font-rendering diffs on macOS)"
run = '''#!/usr/bin/env bash
set -uo pipefail
export CI=true

pnpm exec playwright install chromium || exit 1

# ci.yml marks this job `continue-on-error: true`, so a diff must not fail the
# overall run. Report loudly and exit 0; diffs land in test-results/site-visual.
#
# The committed baselines are rendered on ubuntu-latest. Running this on macOS
# reports diffs on nearly every snapshot purely from font rasterization, so
# treat local output as a smoke test that the suite runs — not as a signal about
# whether the baselines are correct. Only trust the CI job for that.
if ! PLAYWRIGHT_USE_EXISTING_BUILD=1 pnpm --filter @solidiom/site run test:visual; then
  echo "" >&2
  echo "ADVISORY: site-visual failed (continue-on-error: true in ci.yml)." >&2
  echo "          Diffs: test-results/site-visual" >&2
  echo "          On macOS, expect platform font diffs; compare against the CI job." >&2
  echo "          Accept intended changes with: pnpm --filter @solidiom/site run test:visual:update" >&2
fi
'''

[tasks."ci:site-lighthouse"]
description = "CI job `site-lighthouse`: Lighthouse budgets against a preview server — ADVISORY, mirrors continue-on-error (run ci:site-build first; needs local Chrome)"
run = '''#!/usr/bin/env bash
set -uo pipefail

# CI installs Chrome via browser-actions/setup-chrome; locally this relies on
# an existing Chrome installation.
pnpm --filter @solidiom/site preview --host 127.0.0.1 --port 4322 > /dev/null 2>&1 &
preview_pid=$!
trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

ready=0
for _ in $(seq 1 30); do
  if curl --fail --silent http://127.0.0.1:4322/ > /dev/null; then ready=1; break; fi
  sleep 1
done

# ci.yml marks this job `continue-on-error: true`; never fail the overall run.
if [ "$ready" -ne 1 ]; then
  echo "ADVISORY: preview server never became ready on 127.0.0.1:4322." >&2
  exit 0
fi

if ! pnpm --filter @solidiom/site run lighthouse:json; then
  echo "" >&2
  echo "ADVISORY: site-lighthouse failed (continue-on-error: true in ci.yml)." >&2
fi
'''

[tasks."ci:smoke-create-prep"]
description = "CI job `cli-smoke-create-prep`: warm the offline Verdaccio registry snapshot (NETWORK REQUIRED; needs a prior build)"
run = "tools/offline-fixture/run-offline-test.sh --prep"

[tasks."ci:smoke-create"]
description = "CI job `cli-smoke-create`: offline create/install/typecheck/build/test for npm, pnpm, yarn, and bun (run ci:smoke-create-prep first)"
run = '''#!/usr/bin/env bash
set -uo pipefail

mkdir -p artifacts

# ci.yml sets `fail-fast: false` on this matrix, so run every manager and
# report the full set of failures rather than stopping at the first.
failed=""
for manager in npm pnpm yarn bun; do
  echo "==> cli-smoke-create: ${manager}"
  if ! tools/offline-fixture/run-offline-test.sh \
    --manager "${manager}" \
    --smoke-json-out "artifacts/smoke-create-${manager}.json"; then
    failed="${failed} ${manager}"
  fi
done

if [ -n "$failed" ]; then
  echo "" >&2
  echo "cli-smoke-create failed for:${failed}" >&2
  exit 1
fi
'''

[tasks."ci:catalog-gates"]
description = "CI job `catalog-gates`: component + block catalog verification (needs a prior build)"
run = [
  "pnpm run component:catalog-gate",
  "pnpm run block:catalog-gate",
]

[tasks."ci:gates"]
description = "CI job `gates`: consolidated phase1/phase2/phase0/phase3 (needs a prior build + all tests passing)"
env = { CI = "true" }
run = [
  "pnpm exec playwright install chromium",
  "pnpm run gate:phase1",
  "pnpm run gate:phase2",
  "pnpm run gate:phase0",
  "pnpm run gate:phase3",
]

[tasks."ci:vertical-slice-gate"]
description = "CI job `vertical-slice-gate`: VS-004 gate, the executable half of the G2 exit checklist (needs a prior build)"
run = "pnpm run gate:vertical-slice"

[tasks."ci:beta-acceptance-report"]
description = "CI job `beta-acceptance-report`: BETA-002 static-build acceptance report (run ci:site-build first; reads apps/site/dist, no server needed)"
run = "pnpm run beta:acceptance:report"

[tasks."ci:beta-acceptance-e2e"]
description = "CI job `beta-acceptance-e2e`: BETA-002 cross-browser acceptance (run ci:site-build first)"
env = { PLAYWRIGHT_USE_EXISTING_BUILD = "1", CI = "true" }
run = [
  "pnpm exec playwright install chromium firefox webkit",
  "pnpm run beta:acceptance:e2e",
]

# ---------------------------------------------------------------------------
# Release workflow — atomic steps (mirror .github/workflows/release.yml)
# ---------------------------------------------------------------------------

[tasks."release:changeset-status"]
description = "Release: report changeset status"
run = "pnpm changeset status"

[tasks."release:version-check"]
description = "Release: validate the version plan without publishing (dry run)"
run = 'pnpm changeset version --dry-run 2>&1 || echo "No changesets to version"'

[tasks."release:beta-artifacts"]
description = "Release: generate and verify beta-catalog.json and beta-pointer.json"
run = "pnpm tsx tools/generate-beta-artifacts.ts --verify"

[tasks."release:beta-rehearsal"]
description = "Release: full local rehearsal (gate + artifacts + verify signing) without publishing"
run = [
  "pnpm run gate:phase3",
  "pnpm run registry:build",
  "node packages/cli/dist/bin.js verify --registry",
  "pnpm tsx tools/generate-beta-artifacts.ts --verify",
  "pnpm tsx tools/verify-beta-signing.ts || echo 'ADVISORY: signing verification requires REGISTRY_SIGN_KEY (CI-only)'",
]

# ---------------------------------------------------------------------------
# Workflow orchestrators — call the atomic tasks above in CI order.
# Runs sequentially and stops on the first failure (fail-fast), except for the
# two jobs ci.yml marks `continue-on-error: true` (site-visual, site-lighthouse).
# ---------------------------------------------------------------------------

[tasks."ci:all"]
description = "Run every ci.yml job locally in dependency order (includes Node matrix and offline smoke; excludes Solid matrix which is in solid-compat.yml)"
run = [
  "mise run ci:install",
  # Parallel in CI: format, typecheck, build, site-check
  "mise run ci:format",
  "mise run ci:typecheck",
  "mise run ci:build",
  "mise run ci:site-check",
  # needs: site-check
  "mise run ci:site-build",
  # needs: build (tests consume build output in CI; locally they use existing dist/)
  "mise run ci:test-node",
  "mise run ci:test-browser",
  "mise run ci:a11y-axe-scan",
  "mise run ci:catalog-gates",
  "mise run ci:vertical-slice-gate",
  # needs: build (smoke tests)
  "mise run ci:smoke-create-prep",
  "mise run ci:smoke-create",
  # needs: site-build
  "mise run ci:site-e2e",
  "mise run ci:site-visual",
  "mise run ci:site-lighthouse",
  "mise run ci:beta-acceptance-report",
  "mise run ci:beta-acceptance-e2e",
  # needs: all tests + a11y + site-e2e + catalog-gates (consolidated gates)
  "mise run ci:gates",
]

[tasks."ci:quick"]
description = "Fast local CI: format + typecheck + build + tests + gates (skips site, smoke, node matrix)"
run = [
  "mise run ci:install",
  "mise run ci:format",
  "mise run ci:typecheck",
  "mise run ci:build",
  "mise run ci:test-node",
  "mise run ci:test-browser",
  "mise run ci:a11y-axe-scan",
  "mise run ci:catalog-gates",
  "mise run ci:gates",
]

[tasks."ci:prepush"]
description = "Pre-push gate: all CI jobs except Node matrix, Solid matrix, and offline smoke"
run = [
  "mise run ci:install",
  "mise run ci:format",
  "mise run ci:typecheck",
  "mise run ci:build",
  "mise run ci:site-check",
  "mise run ci:site-build",
  "mise run ci:test-node",
  "mise run ci:test-browser",
  "mise run ci:a11y-axe-scan",
  "mise run ci:catalog-gates",
  "mise run ci:vertical-slice-gate",
  "mise run ci:site-e2e",
  "mise run ci:site-visual",
  "mise run ci:beta-acceptance-report",
  "mise run ci:beta-acceptance-e2e",
  "mise run ci:gates",
]

[tasks.github-workflows]
description = "Run all CI and release workflow checks locally"
run = [
  "mise run ci:all",
  "mise run release:changeset-status",
  "mise run release:version-check",
]
# solid-compat.yml runs nightly; use `mise run ci:solid-matrix` to run locally.
# preview-deploy.yml deploys to Cloudflare — not reproducible locally.

# ---------------------------------------------------------------------------
# Dependency freshness
# ---------------------------------------------------------------------------

[tasks."deps:check"]
description = "Check the key third-party libraries for new versions"
run = "pnpm tsx scripts/check-library-updates.mts"

# ---------------------------------------------------------------------------
# Scaffolding / Generative Authoring (3B)
# ---------------------------------------------------------------------------

[tasks."scaffold:primitive"]
description = "Scaffold a new primitive package → pnpm tsx tools/scaffold-primitive.ts <name>"
run = "pnpm tsx tools/scaffold-primitive.ts {{arg(name='primitive')}}"

[tasks."scaffold:sync"]
description = "Regenerate stale generated artifacts (recipes, themes, source/)"
run = "pnpm tsx tools/scaffold-sync.ts"

[tasks."scaffold:sync:check"]
description = "Check generated artifacts freshness (CI mode, no writes)"
run = "pnpm tsx tools/scaffold-sync.ts --check"

[tasks."scaffold:drift-gate"]
description = "CI gate: verify no generated artifact has drifted from its contract"
run = "pnpm tsx tools/scaffold-drift-gate.ts"

[tasks."contract:check"]
description = "Verify all recipe definitions use the current CONTRACT_VERSION"
run = "pnpm tsx tools/contract-version.ts check"

[tasks."contract:bump"]
description = "Bump CONTRACT_VERSION and generate a migration stub"
run = "pnpm tsx tools/contract-version.ts bump"

[tasks."deps:check:group"]
description = "Check one library group  →  mise run deps:check:group -- solid"
run = "pnpm tsx scripts/check-library-updates.mts --group {{arg(name='group')}}"

[tasks."deps:check:json"]
description = "Write the library freshness report to artifacts/library-updates.json"
run = [
  "mkdir -p artifacts",
  "pnpm tsx scripts/check-library-updates.mts --json > artifacts/library-updates.json",
]

# ---------------------------------------------------------------------------
# Maintenance
# ---------------------------------------------------------------------------

[tasks.install]
description = "Install all workspace dependencies"
run = "pnpm install"

[tasks.clean]
description = "Remove all dist/ output directories"
run = "find packages apps -name dist -type d -prune -exec rm -rf {} +"

[tasks."clean:nx"]
description = "Clear the nx build cache"
run = "pnpm nx reset"

# ---------------------------------------------------------------------------
# Pre-commit
# ---------------------------------------------------------------------------

[tasks."precommit:format"]
description = "Pre-commit: check formatting"
depends = ["format:check"]
run = 'echo "✓ format"'

[tasks."precommit:lint"]
description = "Pre-commit: lint"
depends = ["precommit:format"]
run = "mise run lint"

[tasks."precommit:typecheck"]
description = "Pre-commit: typecheck"
depends = ["precommit:lint"]
run = "mise run typecheck"

[tasks."precommit:build"]
description = "Pre-commit: build"
depends = ["precommit:typecheck"]
run = "mise run build"

[tasks."precommit:test"]
description = "Pre-commit: test"
depends = ["precommit:build"]
run = "mise run test"

[tasks."precommit:audit"]
description = "Pre-commit: run all audits"
depends = ["precommit:test"]
run = "mise run audit && mise run audit:recipes"

[tasks.precommit]
description = "Run all checks required before committing (format, lint, typecheck, build, test, audits)"
depends = ["precommit:audit"]
run = 'echo "✓ All pre-commit checks passed."'
