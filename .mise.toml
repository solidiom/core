[tools]
node = "latest"
pnpm = "latest"
gh = "latest"
# CLI smoke coverage requires all four package managers. CI gets yarn through
# Corepack and Bun through setup-bun; Mise provides matching local tools.
yarn = "1.22.22"
bun = "1.3.14"

[env]
# Prevent global mise npm tools from conflicting with workspace-local tools
# managed by pnpm.
MISE_DISABLE_TOOLS = "npm:opencode-ai,npm:opencode-codebase-index,npm:playwright,npm:slides-grab,npm:@openai/codex,npm:@playwright/cli,npm:@storybook/addon-mcp,npm:@bitbonsai/mcpvault,npm:@swarmvaultai/cli,npm:corepack,npm:typescript,npm:tsx,npm:rimraf"

# ---------------------------------------------------------------------------
# Build and development
# ---------------------------------------------------------------------------

[tasks.build]
description = "Build all workspace packages"
run = "pnpm nx run-many -t build"

[tasks."build:package"]
description = "Build one package → mise run build:package -- @solidiom/button"
run = "pnpm nx build"

[tasks."build:recipes"]
description = "Build the CSS and Tailwind recipe packages"
run = "pnpm nx run-many -t build --projects=@solidiom/recipes-css,@solidiom/recipes-tailwind"

[tasks."build:site"]
description = "Build the site application"
run = "pnpm --filter @solidiom/site build"

[tasks."build:registry"]
description = "Generate registry manifests (writes registry/*.json)"
run = "pnpm run registry:build"

[tasks."site:validate"]
description = "Run the local equivalent of CI site validation and build"
run = [
  "pnpm --filter @solidiom/site check",
  "pnpm --filter @solidiom/site run boundaries",
  "pnpm --filter @solidiom/site run i18n:validate",
  "pnpm --filter '@solidiom/template-*' build",
  "pnpm --filter @solidiom/site build",
  "pnpm --filter @solidiom/site search-index",
  "pnpm --filter @solidiom/site run registry-route-check",
]

[tasks."i18n:validate"]
description = "Validate site translations"
run = "pnpm --filter @solidiom/site run i18n:validate"

[tasks."dev:site"]
description = "Start the site development server"
run = "pnpm --filter @solidiom/site run dev"

# ---------------------------------------------------------------------------
# Test, type-check, and formatting
# ---------------------------------------------------------------------------

[tasks.test]
description = "Run all Node-mode unit tests"
run = "pnpm test"

[tasks."test:unit"]
description = "Run Vitest unit tests directly"
run = "pnpm exec vitest run --config vitest.config.ts"

[tasks."test:browser"]
description = "Run the full browser component matrix"
run = "pnpm run test:browser"

[tasks."test:e2e"]
description = "Run Playwright end-to-end tests"
run = "pnpm run test:e2e"

[tasks."test:all"]
description = "Run unit, browser, and end-to-end tests"
run = ["mise run test", "mise run test:browser", "mise run test:e2e"]

[tasks."test:package"]
description = "Test one package → mise run test:package -- @solidiom/button"
run = "pnpm nx test"

[tasks."test:primitives"]
description = "Run tests for primitive-layer packages"
run = "pnpm nx run-many -t test --projects='tag:layer:primitive'"

[tasks.typecheck]
description = "Type-check all packages"
run = "pnpm typecheck"

[tasks."typecheck:primitives"]
description = "Type-check primitive-layer packages"
run = "pnpm nx run-many -t typecheck --projects='tag:layer:primitive'"

[tasks.lint]
description = "Lint all packages"
run = "pnpm nx run-many -t lint"

[tasks."lint:fix"]
description = "Lint all packages and apply fixes"
run = "pnpm nx run-many -t lint -- --fix"

[tasks.format]
description = "Format all files with Prettier"
run = "pnpm exec prettier --write ."

[tasks."format:check"]
description = "Check formatting without writing"
run = "pnpm run format:check"

# ---------------------------------------------------------------------------
# Changesets and release dispatch
# ---------------------------------------------------------------------------

[tasks.changeset]
description = "Create a Changeset"
run = "pnpm changeset"

[tasks."release:changeset-status"]
description = "Show pending Changesets"
run = "pnpm changeset status"

# Changeset package releases, registry signing, version commits, and Cloudflare
# deployment are owned by .github/workflows/release.yml. These tasks only
# dispatch and follow that workflow through scripts/release.sh.
[tasks."release:publish"]
description = "Dispatch the GitHub release workflow for packages and site (quick gate)"
run = "scripts/release.sh --target all --gate quick"

[tasks."release:publish:full"]
description = "Dispatch the GitHub release workflow for packages and site (full gate)"
run = "scripts/release.sh --target all --gate full"

[tasks."release:packages"]
description = "Dispatch the GitHub release workflow for packages only (quick gate)"
run = "scripts/release.sh --target packages --gate quick"

[tasks."release:packages:full"]
description = "Dispatch the GitHub release workflow for packages only (full gate)"
run = "scripts/release.sh --target packages --gate full"

[tasks."release:site"]
description = "Dispatch the GitHub release workflow for the site only"
run = "scripts/release.sh --target site"

[tasks."release:package"]
description = "Locally publish one independent package → mise run release:package -- @solidiom/button"
run = "pnpm release:package"

[tasks."release:package:dry-run"]
description = "Validate one package release without publishing → mise run release:package:dry-run -- @solidiom/button"
run = "pnpm release:package --dry-run"

# ---------------------------------------------------------------------------
# Acceptance gates and accessibility
# ---------------------------------------------------------------------------

[tasks."gate:quick"]
description = "Run the quick structural acceptance gate"
run = "pnpm run gate:quick"

[tasks."gate:full"]
description = "Run the full durable release gate"
run = "pnpm run gate:full"

[tasks."gate:vertical-slice"]
description = "Run the vertical-slice acceptance gate"
run = "pnpm run gate:vertical-slice"

[tasks."a11y:scan"]
description = "Run executable axe accessibility scans"
run = "pnpm run test:a11y"

[tasks."a11y:evidence"]
description = "Publish accessibility evidence from the executed axe artifact"
run = "pnpm run report:a11y-evidence"

[tasks."a11y:report"]
description = "Generate the axe report from the executed result artifact"
run = "pnpm run report:axe"

# ---------------------------------------------------------------------------
# Local CI equivalents
#
# These are local reproductions of workflow behavior, not replacements for
# hosted CI. They intentionally omit artifact transfers and PR preview deploys.
# `ci:quick` matches the fast PR tier; `ci:full` matches the comprehensive
# main/full-dispatch tier. Browser compatibility and Solid-version coverage
# live under the nightly namespace.
# ---------------------------------------------------------------------------

[tasks."ci:install"]
description = "Install dependencies from the frozen lockfile"
run = "scripts/ci-log.sh install -- pnpm install --frozen-lockfile"

[tasks."ci:format"]
description = "CI format check"
run = "scripts/ci-log.sh format -- pnpm run format:check"

[tasks."ci:typecheck"]
description = "CI typecheck"
run = "scripts/ci-log.sh typecheck -- pnpm typecheck"

[tasks."ci:build"]
description = "Build packages and run CI integrity checks without regenerating artifacts"
run = '''#!/usr/bin/env bash
set -uo pipefail

LOG_FILE="test-results/build.log"
mkdir -p test-results

{
  set -e
  pnpm nx run-many -t build --exclude=@solidiom/site
  node packages/cli/dist/bin.js verify --registry
  pnpm run api:coverage-gate
  pnpm run audit:package-source-parity
  pnpm run theme:emit:css:check
  pnpm run theme:emit:tailwind:check
  pnpm run theme:emit:unocss:check
  pnpm run audit:theme-parity
  pnpm run audit:preset-themes
  pnpm run assert:no-unverified

  PATHSPEC=(registry/ 'packages/*/source/' 'packages/*/docs/accessibility/evidence.json')
  if ! git diff --quiet -- "${PATHSPEC[@]}"; then
    echo "Generated artifacts are stale. Run 'pnpm build && pnpm run report:a11y-evidence && pnpm run registry:build', then commit the result." >&2
    git diff --stat -- "${PATHSPEC[@]}" >&2
    exit 1
  fi
} 2>&1 | tee "$LOG_FILE"
EXIT_CODE=${PIPESTATUS[0]}

if [ "$EXIT_CODE" -ne 0 ]; then
  echo ""
  echo "════════════════════════════════════════════════════════════"
  echo "  BUILD FAILED (exit ${EXIT_CODE})"
  echo "════════════════════════════════════════════════════════════"
  echo ""
  grep -nE "(FAIL|ERROR|Error|error:|stale|Cannot|not found|ENOENT|Timeout)" "$LOG_FILE" | tail -60 || echo "  (no recognizable error markers; see full log)"
  echo ""
  echo "────────────────────────────────────────────────────────────"
  echo "  Full log: $LOG_FILE"
  echo "════════════════════════════════════════════════════════════"
fi

exit "$EXIT_CODE"
'''

[tasks."ci:test-node"]
description = "Run the CI Node test surface (requires a prior build)"
env = { CI = "true" }
run = [
  "pnpm exec playwright install chromium",
  "scripts/ci-log.sh test-node -- pnpm test",
  "scripts/ci-log.sh test-tools -- pnpm run test:tools",
]

[tasks."ci:test-browser"]
description = "Run Chromium browser component tests and recipe parity (requires a prior build)"
env = { CI = "true", VITEST_BROWSERS = "chromium" }
run = [
  "pnpm exec playwright install chromium",
  "scripts/ci-log.sh test-browser -- pnpm exec vitest run --config vitest.browser.config.ts",
  "scripts/ci-log.sh test-recipe-parity -- pnpm run test:recipe-parity",
]

[tasks."ci:a11y"]
description = "Run CI accessibility scans, evidence, coverage, and report checks"
env = { CI = "true" }
run = [
  "pnpm exec playwright install chromium",
  "scripts/ci-log.sh a11y-scan -- pnpm run test:a11y",
  "scripts/ci-log.sh a11y-evidence -- pnpm run report:a11y-evidence",
  "scripts/ci-log.sh a11y-coverage-gate -- pnpm run a11y:coverage-gate",
  "scripts/ci-log.sh a11y-report -- pnpm run report:axe",
]

[tasks."ci:site-check"]
description = "Run CI site checks: Astro, boundaries, and i18n"
run = [
  "scripts/ci-log.sh site-check-astro -- pnpm --filter @solidiom/site check",
  "scripts/ci-log.sh site-check-boundaries -- pnpm --filter @solidiom/site run boundaries",
  "scripts/ci-log.sh site-check-i18n -- pnpm --filter @solidiom/site run i18n:validate",
]

[tasks."ci:site-build"]
description = "Build templates and the site, index search, and verify registry routes"
run = [
  "scripts/ci-log.sh site-build-templates -- pnpm --filter '@solidiom/template-*' build",
  "scripts/ci-log.sh site-build -- pnpm --filter @solidiom/site build",
  "scripts/ci-log.sh site-search-index -- pnpm --filter @solidiom/site search-index",
  "scripts/ci-log.sh site-registry-route-check -- pnpm --filter @solidiom/site run registry-route-check",
]

[tasks."ci:site-e2e"]
description = "Run site E2E against a prebuilt site (run ci:site-build first)"
env = { CI = "true", PLAYWRIGHT_USE_EXISTING_BUILD = "1" }
run = '''#!/usr/bin/env bash
set -uo pipefail

# Kill any leftover process on port 4322 to avoid "port already in use" errors
# when Playwright starts its webServer with reuseExistingServer=false.
lsof -ti :4322 | xargs kill -9 2>/dev/null || true

pnpm exec playwright install chromium firefox webkit

LOG_FILE="test-results/site-e2e.log"
mkdir -p test-results

pnpm --filter @solidiom/site run test:e2e 2>&1 | tee "$LOG_FILE"
EXIT_CODE=${PIPESTATUS[0]}

if [ $EXIT_CODE -ne 0 ]; then
  echo ""
  echo "════════════════════════════════════════════════════════════"
  echo "  SITE E2E FAILURES"
  echo "════════════════════════════════════════════════════════════"
  echo ""
  # Print lines around failure markers from the log
  grep -E "(FAIL|Error|✘|×|expect\()" "$LOG_FILE" | head -80
  echo ""
  echo "────────────────────────────────────────────────────────────"
  echo "  Full log:    $LOG_FILE"
  echo "  JSON report: test-results/site-e2e-results.json"
  echo "  HTML report: npx playwright show-report test-results/site-e2e-report"
  echo "════════════════════════════════════════════════════════════"
fi

exit $EXIT_CODE
'''

[tasks."ci:site-visual"]
description = "Verify visual baselines in the pinned Playwright container"
env = { CI = "true", PLAYWRIGHT_USE_EXISTING_BUILD = "1" }
run = "scripts/ci-log.sh site-visual -- pnpm run visual:container"

[tasks."ci:site-lighthouse"]
description = "Run Lighthouse locally (advisory; requires a prior site build and local Chrome)"
run = '''#!/usr/bin/env bash
set -uo pipefail

# Kill any leftover process on port 4322 from a prior task (e.g. ci:site-e2e).
lsof -ti :4322 | xargs kill -9 2>/dev/null || true
sleep 1

pnpm --filter @solidiom/site preview --host 127.0.0.1 --port 4322 > /dev/null 2>&1 &
preview_pid=$!
trap 'kill "$preview_pid" 2>/dev/null || true; lsof -ti :4322 | xargs kill -9 2>/dev/null || true' EXIT

for _ in $(seq 1 30); do
  if curl --fail --silent http://127.0.0.1:4322/ > /dev/null; then
    pnpm --filter @solidiom/site run lighthouse:json || echo "ADVISORY: Lighthouse failed." >&2
    exit 0
  fi
  sleep 1
done

echo "ADVISORY: preview server never became ready." >&2
'''

[tasks."ci:smoke-create-prep"]
description = "Warm the offline CLI smoke-test registry (network required; requires a prior build)"
run = '''#!/usr/bin/env bash
set -uo pipefail

# Capture the full prep output to a log file (mirrors ci:site-e2e's logging
# pattern) so long, network-heavy runs can be inspected after the fact and so
# failures under `mise run ci:full` leave an artifact behind.
LOG_FILE="test-results/smoke-create-prep.log"
mkdir -p test-results

pnpm run smoke:create:prep 2>&1 | tee "$LOG_FILE"
EXIT_CODE=${PIPESTATUS[0]}

if [ $EXIT_CODE -ne 0 ]; then
  echo ""
  echo "════════════════════════════════════════════════════════════"
  echo "  SMOKE CREATE PREP FAILED (exit ${EXIT_CODE})"
  echo "════════════════════════════════════════════════════════════"
  echo ""
  # Surface the most relevant lines from the log.
  grep -nE "(ERROR|Error|error:|404|409|EEXIST|failed|FAIL)" "$LOG_FILE" | tail -40
  echo ""
  echo "────────────────────────────────────────────────────────────"
  echo "  Full log: $LOG_FILE"
  echo "════════════════════════════════════════════════════════════"
else
  echo "Prep log written to $LOG_FILE"
fi

exit $EXIT_CODE
'''

[tasks."ci:smoke-create"]
description = "Run the offline CLI smoke matrix (run ci:smoke-create-prep first)"
run = '''#!/usr/bin/env bash
set -uo pipefail

mkdir -p artifacts
failed=""
for manager in npm pnpm yarn bun; do
  echo "==> CLI smoke: ${manager}"
  if ! tools/offline-fixture/run-offline-test.sh \
    --manager "${manager}" \
    --smoke-json-out "artifacts/smoke-create-${manager}.json"; then
    failed="${failed} ${manager}"
  fi
done

if [ -n "$failed" ]; then
  echo "CLI smoke failed for:${failed}" >&2
  exit 1
fi
'''

[tasks."ci:catalog-gates"]
description = "Run component and block catalog gates"
run = [
  "scripts/ci-log.sh catalog-gate-component -- pnpm run component:catalog-gate",
  "scripts/ci-log.sh catalog-gate-block -- pnpm run block:catalog-gate",
]

[tasks."ci:vertical-slice"]
description = "Run the vertical-slice gate"
run = "scripts/ci-log.sh vertical-slice -- pnpm run gate:vertical-slice"

[tasks."ci:gate:quick"]
description = "Run the final fast-tier CI gate"
run = "scripts/ci-log.sh gate-quick -- pnpm run gate:quick"

[tasks."ci:gate:full"]
description = "Run the final comprehensive CI gate"
run = "scripts/ci-log.sh gate-full -- pnpm run gate:full"

[tasks."ci:quick"]
description = "Run the local fast PR-tier checks"
run = [
  "mise run ci:install",
  "mise run ci:format",
  "mise run ci:typecheck",
  "mise run ci:build",
  "mise run ci:test-node",
  "mise run ci:test-browser",
  "mise run ci:gate:quick",
]

[tasks."ci:full"]
description = "Run the local comprehensive main/full-dispatch CI checks (both targets)"
run = [
  "mise run ci:install",
  "mise run ci:format",
  "mise run ci:typecheck",
  "mise run ci:build",
  "mise run ci:test-node",
  "mise run ci:test-browser",
  "mise run ci:a11y",
  "mise run ci:site-check",
  "mise run ci:site-build",
  "mise run ci:site-e2e",
  "mise run ci:site-visual",
  "mise run ci:site-lighthouse",
  "mise run ci:smoke-create-prep",
  "mise run ci:smoke-create",
  "mise run ci:catalog-gates",
  "mise run ci:vertical-slice",
  "mise run ci:gate:full",
]

# ---------------------------------------------------------------------------
# Split-target offline CI mirrors
#
# `ci:packages` mirrors .github/workflows/ci-packages.yml and `ci:site` mirrors
# .github/workflows/ci-site.yml. Each is self-contained (installs + builds from
# scratch) so it faithfully reproduces its independent workflow. Run the task
# matching the target you changed before pushing; use `ci:full` to run
# everything once (it sequences the shared install + build a single time).
# ---------------------------------------------------------------------------

[tasks."ci:packages"]
description = "Local mirror of ci-packages.yml (full-matrix package target)"
run = [
  "mise run ci:install",
  "mise run ci:format",
  "mise run ci:typecheck",
  "mise run ci:build",
  "mise run ci:test-node",
  "mise run ci:test-browser",
  "mise run ci:a11y",
  "mise run ci:smoke-create-prep",
  "mise run ci:smoke-create",
  "mise run ci:catalog-gates",
  "mise run ci:gate:full",
]

[tasks."ci:packages:quick"]
description = "Local mirror of ci-packages.yml fast tier (full_matrix=false)"
run = [
  "mise run ci:install",
  "mise run ci:format",
  "mise run ci:typecheck",
  "mise run ci:build",
  "mise run ci:test-node",
  "mise run ci:test-browser",
  "mise run ci:gate:quick",
]

[tasks."ci:site"]
description = "Local mirror of ci-site.yml (full site suite). Builds packages first, as the site resolves built primitives."
run = [
  "mise run ci:install",
  "mise run ci:build",
  "mise run ci:site-check",
  "mise run ci:site-build",
  "mise run ci:site-e2e",
  "mise run ci:site-visual",
  "mise run ci:site-lighthouse",
  "mise run ci:vertical-slice",
]

[tasks."ci:site:quick"]
description = "Local mirror of ci-site.yml fast tier: package build + site check + build only"
run = [
  "mise run ci:install",
  "mise run ci:build",
  "mise run ci:site-check",
  "mise run ci:site-build",
]

# ---------------------------------------------------------------------------
# Local nightly equivalents
# ---------------------------------------------------------------------------

[tasks."nightly:browser-full"]
description = "Run the full Chromium, Firefox, and WebKit browser suite"
env = { CI = "true" }
run = [
  "pnpm nx run-many -t build --exclude=@solidiom/site",
  "pnpm exec playwright install chromium firefox webkit",
  "pnpm exec vitest run --config vitest.browser.config.ts",
  "pnpm run test:recipe-parity",
]

[tasks."nightly:solid-compat"]
description = "Run the Solid low/mid/high × Node 24/26 compatibility matrix"
run = '''#!/usr/bin/env bash
set -euo pipefail
export CI=true

tmp_dir="$(mktemp -d)"
cp package.json "$tmp_dir/package.json"
cp pnpm-lock.yaml "$tmp_dir/pnpm-lock.yaml"
trap 'cp "$tmp_dir/package.json" package.json; cp "$tmp_dir/pnpm-lock.yaml" pnpm-lock.yaml; rm -rf "$tmp_dir"; pnpm install --frozen-lockfile' EXIT

for node_version in 24 26; do
  for solid_tier in low mid high; do
    echo "==> Solid matrix: Node ${node_version}, Solid ${solid_tier}"
    mise exec "node@${node_version}" -- node scripts/set-solid-version.mjs "$solid_tier"
    mise exec "node@${node_version}" -- pnpm install --no-frozen-lockfile
    mise exec "node@${node_version}" -- pnpm exec playwright install chromium firefox webkit
    mise exec "node@${node_version}" -- pnpm nx run-many -t build --exclude=@solidiom/site
    mise exec "node@${node_version}" -- pnpm nx run-many -t test --exclude=@solidiom/tests-package-source-parity,@solidiom/site
    mise exec "node@${node_version}" -- pnpm exec vitest run --config vitest.browser.config.ts
  done
done
'''

[tasks."nightly:visual-baselines:update"]
description = "Regenerate visual baselines in the pinned Playwright container"
run = "pnpm run visual:update:container"

[tasks."nightly:deps-check"]
description = "Check dependency freshness (nightly equivalent)"
run = "pnpm run deps:check"

# ---------------------------------------------------------------------------
# Affected-only local checks
# ---------------------------------------------------------------------------

[tasks."affected:build"]
description = "Build packages affected since main"
run = "pnpm nx affected -t build --exclude=@solidiom/site"

[tasks."affected:test"]
description = "Test packages affected since main"
run = "pnpm nx affected -t test --exclude=@solidiom/site"

[tasks."affected:typecheck"]
description = "Type-check packages affected since main"
run = "pnpm nx affected -t typecheck --exclude='tag:layer:template'"

[tasks."affected:all"]
description = "Build, type-check, and test packages affected since main"
run = [
  "mise run affected:build",
  "mise run affected:typecheck",
  "mise run affected:test",
]

# ---------------------------------------------------------------------------
# Audits, scaffolding, and maintenance
# ---------------------------------------------------------------------------

[tasks.graph]
description = "Open the Nx project dependency graph"
run = "pnpm nx graph"

[tasks.audit]
description = "Run the primitive normalization audit"
run = "pnpm tsx tools/audit-primitives.ts"

[tasks."audit:recipes"]
description = "Verify recipe selector contracts"
run = "pnpm run audit:recipe-contract"

[tasks."scaffold:primitive"]
description = "Scaffold a primitive → mise run scaffold:primitive -- button"
run = "pnpm tsx tools/scaffold-primitive.ts"

[tasks."scaffold:sync"]
description = "Regenerate stale recipe, theme, and source artifacts"
run = "pnpm tsx tools/scaffold-sync.ts"

[tasks."scaffold:sync:check"]
description = "Check generated-artifact freshness without writing"
run = "pnpm tsx tools/scaffold-sync.ts --check"

[tasks."scaffold:drift-gate"]
description = "Verify generated artifacts have not drifted from contracts"
run = "pnpm tsx tools/scaffold-drift-gate.ts"

[tasks."contract:check"]
description = "Verify recipe definitions use the current contract version"
run = "pnpm tsx tools/contract-version.ts check"

[tasks."contract:bump"]
description = "Bump the recipe contract version and generate a migration stub"
run = "pnpm tsx tools/contract-version.ts bump"

[tasks."deps:check"]
description = "Check key third-party libraries for updates"
run = "pnpm run deps:check"

[tasks."deps:check:group"]
description = "Check one dependency group → mise run deps:check:group -- solid"
run = "pnpm tsx scripts/check-library-updates.mts --group"

[tasks."deps:check:json"]
description = "Write dependency freshness data to artifacts/library-updates.json"
run = [
  "mkdir -p artifacts",
  "pnpm tsx scripts/check-library-updates.mts --json > artifacts/library-updates.json",
]

[tasks.install]
description = "Install workspace dependencies"
run = "pnpm install"

[tasks.clean]
description = "Remove generated dist directories"
run = "find packages apps -name dist -type d -prune -exec rm -rf {} +"

[tasks."clean:nx"]
description = "Clear the Nx cache"
run = "pnpm nx reset"

# ---------------------------------------------------------------------------
# Pre-commit
# ---------------------------------------------------------------------------

[tasks."precommit:format"]
description = "Pre-commit format check"
depends = ["format:check"]
run = 'echo "✓ format"'

[tasks."precommit:lint"]
description = "Pre-commit lint"
depends = ["precommit:format"]
run = "mise run lint"

[tasks."precommit:typecheck"]
description = "Pre-commit typecheck"
depends = ["precommit:lint"]
run = "mise run typecheck"

[tasks."precommit:build"]
description = "Pre-commit build"
depends = ["precommit:typecheck"]
run = "mise run build"

[tasks."precommit:test"]
description = "Pre-commit tests"
depends = ["precommit:build"]
run = "mise run test"

[tasks."precommit:audit"]
description = "Pre-commit audits"
depends = ["precommit:test"]
run = "mise run audit && mise run audit:recipes"

[tasks.precommit]
description = "Run all required pre-commit checks"
depends = ["precommit:audit"]
run = 'echo "✓ All pre-commit checks passed."'
