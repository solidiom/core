name: "Setup workspace"
description: "Install pnpm/node, restore module cache, install dependencies, and optionally set up Playwright."

inputs:
  node-version:
    description: "Node.js version to install"
    required: false
    default: "24"
  install:
    description: "Whether to run pnpm install (set to 'false' to skip)"
    required: false
    default: "true"
  frozen-lockfile:
    description: "Use --frozen-lockfile (set to 'false' for non-frozen installs)"
    required: false
    default: "true"
  playwright:
    description: "Playwright browsers to install (e.g. 'chromium', 'chromium firefox webkit', or 'false' to skip)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # Install Node first so pnpm/action-setup can use a modern Node for its
    # self-installer (the runner's default Node is too old for node: imports).
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    - uses: pnpm/action-setup@v6

    # Re-run setup-node with cache now that pnpm is available for key hashing.
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - uses: actions/cache/restore@v5
      with:
        path: |
          node_modules
          packages/*/node_modules
          apps/*/node_modules
          tests/*/node_modules
          tools/*/node_modules
        key: modules-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: |
        if [ "${{ inputs.frozen-lockfile }}" = "true" ]; then
          pnpm install --frozen-lockfile
        else
          pnpm install --no-frozen-lockfile
        fi

    - name: Cache Playwright browsers
      if: inputs.playwright != 'false'
      id: playwright-cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ inputs.playwright }}-${{ hashFiles('**/pnpm-lock.yaml') }}

    - name: Install Playwright browsers
      if: inputs.playwright != 'false' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps ${{ inputs.playwright }}

    - name: Install Playwright system deps
      if: inputs.playwright != 'false' && steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps ${{ inputs.playwright }}
