name: "Setup workspace"
description: "Install pnpm/node, restore module cache, install dependencies, and optionally set up Playwright."

inputs:
  node-version:
    description: "Node.js version to install"
    required: false
    default: "24"
  install:
    description: "Whether to run pnpm install (set to 'false' to skip)"
    required: false
    default: "true"
  frozen-lockfile:
    description: "Use --frozen-lockfile (set to 'false' for non-frozen installs)"
    required: false
    default: "true"
  playwright:
    description: "Playwright browsers to install (e.g. 'chromium', 'chromium firefox webkit', or 'false' to skip)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # Install Node first so pnpm/action-setup can use a modern Node for its
    # corepack self-installer (the runner's system Node is too old).
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        # Disable automatic package-manager caching on this first pass; pnpm
        # isn't on PATH yet so the cache key hash would fail.
        package-manager-cache: false

    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

    # Now that pnpm is available, re-run setup-node to enable pnpm store cache.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          packages/*/node_modules
          apps/*/node_modules
          tests/*/node_modules
          tools/*/node_modules
        key: modules-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: |
        if [ "${{ inputs.frozen-lockfile }}" = "true" ]; then
          pnpm install --frozen-lockfile
        else
          pnpm install --no-frozen-lockfile
        fi

    - name: Cache Playwright browsers
      if: inputs.playwright != 'false'
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ inputs.playwright }}-${{ hashFiles('**/pnpm-lock.yaml') }}

    - name: Install Playwright system deps
      if: inputs.playwright != 'false'
      shell: bash
      run: |
        set -euo pipefail
        log_file="$(mktemp)"
        trap 'rm -f "$log_file"' EXIT
        set +e
        pnpm exec playwright install-deps ${{ inputs.playwright }} > "$log_file" 2>&1
        install_status=$?
        set -e
        cat "$log_file"
        if [ "$install_status" -eq 0 ]; then
          exit 0
        fi
        if grep -Fq "your OS is not officially supported" "$log_file" && \
          grep -Fq "Cannot install dependencies for" "$log_file"; then
          echo "::warning::Playwright does not support dependency installation on this runner image; using its preinstalled system libraries."
          exit 0
        fi
        echo "::error::Playwright system dependency installation failed."
        exit "$install_status"

    - name: Install Playwright browsers
      if: inputs.playwright != 'false' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install ${{ inputs.playwright }}
