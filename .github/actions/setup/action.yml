name: "Setup workspace"
description: "Install pnpm/node, restore the module cache, and install workspace dependencies."

inputs:
  node-version:
    description: "Node.js version to install"
    required: false
    default: "24"
  install:
    description: "Whether to run pnpm install (set to 'false' to skip)"
    required: false
    default: "true"
  frozen-lockfile:
    description: "Use --frozen-lockfile (set to 'false' for non-frozen installs)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # Install Node first so pnpm/action-setup can use a modern Node for its
    # corepack self-installer (the runner's system Node is too old).
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        # Disable automatic package-manager caching on this first pass; pnpm
        # isn't on PATH yet so the cache key hash would fail.
        package-manager-cache: false

    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

    # Now that pnpm is available, re-run setup-node to enable pnpm store cache.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          packages/*/node_modules
          apps/*/node_modules
          tests/*/node_modules
          tools/*/node_modules
        key: modules-${{ hashFiles('pnpm-lock.yaml') }}

    # actions/checkout records safe.directory in a temporary HOME. Job
    # containers restore HOME before this action runs, so Git no longer trusts
    # the differently-owned mounted checkout when the root prepare lifecycle
    # configures hooks.
    - name: Trust mounted checkout for lifecycle scripts
      shell: bash
      run: |
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
        fi
        git rev-parse --is-inside-work-tree >/dev/null

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: |
        if [ "${{ inputs.frozen-lockfile }}" = "true" ]; then
          pnpm install --frozen-lockfile
        else
          pnpm install --no-frozen-lockfile
        fi
