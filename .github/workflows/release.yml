name: Release
permissions:
  contents: read
  checks: read

# Production release workflow. A release run never mutates the repository:
#
#   1. version.yml applies pending Changesets in a reviewable Version PR.
#   2. After that PR merges, tag-on-version-merge.yml creates a unique immutable
#      `release-pr-<PR>-<SHA12>` marker and explicitly dispatches this workflow
#      on that tag with the full expected commit SHA.
#   3. This workflow verifies the ref resolves to that exact SHA, requires at
#      least one unpublished package version, then publishes packages and deploys
#      the site. It never runs `changeset version` or commits back.
#
# Manual workflow_dispatch remains an escape hatch. Package targets still fail
# closed when every committed version already exists on npm.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to release"
        required: true
        default: "packages"
        type: choice
        options:
          - packages
          - site
          - all
      gate:
        description: "Gate level before publishing"
        required: false
        default: "quick"
        type: choice
        options:
          - quick
          - full
      dist_tag:
        description: "npm dist-tag to publish under"
        required: false
        default: "beta"
        type: choice
        options:
          - beta
          - latest
      expected_sha:
        description: "Internal exact-SHA guard used by Version PR automation"
        required: false
        default: ""
        type: string

concurrency:
  group: release-${{ inputs.expected_sha || github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ─── Determine what to do ──────────────────────────────────────────────────────

  plan:
    runs-on: self-hosted-dfw-flex
    timeout-minutes: 45
    outputs:
      deploy_packages: ${{ steps.plan.outputs.deploy_packages }}
      deploy_site: ${{ steps.plan.outputs.deploy_site }}
      run_gate: ${{ steps.plan.outputs.run_gate }}
      gate_level: ${{ steps.plan.outputs.gate_level }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
      expected_sha: ${{ steps.plan.outputs.expected_sha }}
    steps:
      - id: plan
        env:
          TARGET: ${{ inputs.target }}
          GATE_LEVEL: ${{ inputs.gate }}
          DIST_TAG: ${{ inputs.dist_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          case "$TARGET" in
            packages)
              echo "deploy_packages=true" >> "$GITHUB_OUTPUT"
              echo "deploy_site=false" >> "$GITHUB_OUTPUT"
              ;;
            site)
              echo "deploy_packages=false" >> "$GITHUB_OUTPUT"
              echo "deploy_site=true" >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo "deploy_packages=true" >> "$GITHUB_OUTPUT"
              echo "deploy_site=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown release target: $TARGET"
              exit 1
              ;;
          esac

          if [ "$TARGET" = "site" ]; then
            echo "run_gate=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
          fi
          echo "gate_level=$GATE_LEVEL" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

  # ─── Guard automated releases to the merged Version PR SHA ─────────────────────

  verify-ref:
    needs: plan
    if: needs.plan.outputs.expected_sha != ''
    runs-on: self-hosted-dfw-flex
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert immutable release ref matches the expected SHA
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.expected_sha }}
        run: |
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::expected_sha must be a full 40-character commit SHA"
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Release ref resolved to $GITHUB_SHA, expected $EXPECTED_SHA"
            exit 1
          fi
          EXPECTED_SUFFIX="${EXPECTED_SHA:0:12}"
          case "$GITHUB_REF_NAME" in
            release-pr-*-$EXPECTED_SUFFIX) ;;
            *)
              echo "::error::Automated release ref $GITHUB_REF_NAME is not bound to $EXPECTED_SUFFIX"
              exit 1
              ;;
          esac
          echo "Verified $GITHUB_REF_NAME at exact SHA $EXPECTED_SHA."

  # ─── Exact-SHA qualification wait ─────────────────────────────────────────────
  # Use a GitHub-hosted runner for the wait so a single-capacity self-hosted
  # pool remains free to execute the package qualification being awaited.

  qualification:
    needs: [plan, verify-ref]
    if: >
      always() &&
      needs.plan.outputs.deploy_packages == 'true' &&
      (needs.verify-ref.result == 'success' || needs.verify-ref.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Wait for exact-SHA required CI and release qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node tools/release-preflight.mjs
          --packages=false
          --site=false
          --verify-ci=true

  # ─── Fail-fast release preflight ──────────────────────────────────────────────
  # Validate target-specific credentials before dependency installation, builds,
  # or browser setup. The script uses only Node built-ins so this remains cheap.

  preflight:
    needs: [plan, verify-ref]
    if: >
      always() &&
      (needs.plan.outputs.deploy_packages == 'true' || needs.plan.outputs.deploy_site == 'true') &&
      (needs.verify-ref.result == 'success' || needs.verify-ref.result == 'skipped')
    runs-on: self-hosted-dfw-flex
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Validate release credentials and service access
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          REGISTRY_SIGN_KEY: ${{ secrets.REGISTRY_SIGN_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >
          node tools/release-preflight.mjs
          --packages=${{ needs.plan.outputs.deploy_packages }}
          --site=${{ needs.plan.outputs.deploy_site }}
          --verify-ci=false

  # ─── Gate ──────────────────────────────────────────────────────────────────────

  gate:
    needs: [plan, verify-ref, qualification, preflight]
    # verify-ref is skipped on dispatch; both exact-SHA qualification and
    # credential preflight must succeed before the expensive gate begins.
    if: >
      always() &&
      needs.plan.outputs.run_gate == 'true' &&
      needs.qualification.result == 'success' &&
      needs.preflight.result == 'success' &&
      (needs.verify-ref.result == 'success' || needs.verify-ref.result == 'skipped')
    # Job containers require a hosted runner (see validate-workflows.mjs).
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm nx run-many -t build --exclude=@solidiom/site
      - name: Run gate
        env:
          SOLIDIOM_GATE_REPORT_DIR: artifacts/gate-reports
        run: |
          if [ "${{ needs.plan.outputs.gate_level }}" = "full" ]; then
            pnpm run gate:full
          else
            pnpm run gate:quick
          fi
      - name: Upload gate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-diagnostics
          path: artifacts/gate-reports/
          if-no-files-found: ignore
          retention-days: 7

  # ─── Publish Packages ─────────────────────────────────────────────────────────
  # Git read-only. The tree is already at its final versions (from the merged
  # Version PR), so this job does NOT run `changeset version` and does NOT
  # commit or push anything. It builds, signs, publishes exactly what is
  # committed, and uploads immutable artifacts.

  publish-packages:
    needs: [plan, preflight, gate]
    if: >
      always() &&
      needs.plan.outputs.deploy_packages == 'true' &&
      needs.preflight.result == 'success' &&
      needs.gate.result == 'success'
    runs-on: self-hosted-dfw-flex
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Build packages
        run: pnpm nx run-many -t build --exclude=@solidiom/site

      # REG-008: Sign the registry index with Ed25519 (regenerates the signature
      # over the already-committed registry content; does not change versions).
      - name: Sign registry index
        env:
          REGISTRY_SIGN_KEY: ${{ secrets.REGISTRY_SIGN_KEY }}
        run: pnpm exec tsx tools/registry-build.ts

      - name: Verify signed registry index
        run: node packages/cli/dist/bin.js verify --registry

      # Publish the versions exactly as committed at this ref. No `changeset
      # version` — versioning already happened in the merged Version PR.
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.plan.outputs.dist_tag }}
        run: |
          set -o pipefail
          PUBLISH_LOG="$(mktemp)"
          trap 'rm -f "$PUBLISH_LOG"' EXIT
          pnpm changeset publish --tag "$DIST_TAG" 2>&1 | tee "$PUBLISH_LOG"
          if grep -Fq "No unpublished projects to publish." "$PUBLISH_LOG"; then
            echo "::error::changeset publish completed without publishing a package"
            exit 1
          fi

      # Generate and verify release artifacts (audit trail; not consumed by the CLI).
      - name: Generate beta artifacts
        env:
          SOLIDIOM_RELEASE_ID: ${{ github.ref_name }}
        run: pnpm exec tsx tools/generate-beta-artifacts.ts --verify

      - name: Verify beta signing
        env:
          REGISTRY_SIGN_KEY: ${{ secrets.REGISTRY_SIGN_KEY }}
        run: pnpm exec tsx tools/verify-beta-signing.ts

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            artifacts/beta-catalog.json
            artifacts/beta-pointer.json
            registry/index.json
          retention-days: 7

  # ─── Deploy Site ───────────────────────────────────────────────────────────────

  deploy-site:
    needs: [plan, preflight, gate, publish-packages]
    # Site-only dispatches do not run a package gate. Combined releases deploy
    # only after both qualification and package publication succeed; a skipped
    # publish caused by a failed gate must never authorize deployment.
    if: >
      always() &&
      needs.plan.outputs.deploy_site == 'true' &&
      needs.preflight.result == 'success' &&
      (needs.plan.outputs.deploy_packages == 'false' ||
        (needs.gate.result == 'success' && needs.publish-packages.result == 'success'))
    runs-on: self-hosted-dfw-flex
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Build packages for source resolution (site depends on primitive builds)
      - name: Build packages
        run: pnpm nx run-many -t build --exclude=@solidiom/site

      - name: Build templates
        run: pnpm --filter '@solidiom/template-*' build

      - name: Validate site structure
        run: |
          pnpm --filter @solidiom/site run boundaries
          pnpm --filter @solidiom/site run route-parity

      - name: Build site
        run: pnpm --filter @solidiom/site run build:deploy

      - name: Generate search index
        run: pnpm --filter @solidiom/site search-index

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: "4.129.0"
          command: pages deploy dist --project-name=solidiom-site --branch=main --commit-dirty=true
          workingDirectory: apps/site
