name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run gate:phase3

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # REG-008: Sign the registry index with Ed25519 over the published artifact.
      # The build produces a deterministic, unsigned registry. This step adds the
      # asymmetric signature using the REGISTRY_SIGN_KEY secret (raw Ed25519 private
      # key as 64 hex chars). The signed index is then ready for distribution.
      - name: REG-008 — sign registry index
        env:
          REGISTRY_SIGN_KEY: ${{ secrets.REGISTRY_SIGN_KEY }}
        run: pnpm exec tsx tools/registry-build.ts

      - name: REG-008 — verify signed registry index
        run: node packages/cli/dist/bin.js verify --registry

      # Apply changeset versions (bumps package versions, updates changelogs)
      - name: Apply changeset versions
        run: pnpm changeset version

      # Rebuild with final versions in package.json
      - name: Rebuild with versioned packages
        run: pnpm build

      # Publish packages to npm with the beta dist-tag.
      # Authentication: OIDC trusted publishing is the long-term mechanism
      # (id-token: write permission above enables it). NODE_AUTH_TOKEN is
      # provided as a fallback for the initial publish before trusted publisher
      # configurations exist on npmjs.com. Once all @solidiom/* packages have
      # trusted publishers configured, remove the NODE_AUTH_TOKEN env var below.
      - name: Publish packages
        run: pnpm changeset publish --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Generate beta release artifacts (catalog + pointer)
      - name: Generate beta artifacts
        run: pnpm exec tsx tools/generate-beta-artifacts.ts --verify

      # Verify beta signing integrity
      - name: Verify beta signing
        env:
          REGISTRY_SIGN_KEY: ${{ secrets.REGISTRY_SIGN_KEY }}
        run: pnpm exec tsx tools/verify-beta-signing.ts

      # Upload artifacts for audit trail
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beta-release-artifacts
          path: |
            artifacts/beta-catalog.json
            artifacts/beta-pointer.json
            registry/index.json

      # Commit version bumps and changelogs back to main
      - name: Commit release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json packages/*/CHANGELOG.md apps/*/package.json .changeset/ pnpm-lock.yaml
          git commit -m "chore(release): publish beta packages" || echo "No changes to commit"
          git push
