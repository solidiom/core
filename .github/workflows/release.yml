name: Release
permissions:
  contents: read
  checks: read

# Production release workflow. The release model is split in two so that a
# release run NEVER mutates the repository:
#
#   1. Versioning happens first, in a reviewable "Version PR" (see version.yml).
#      That PR is where package.json versions, CHANGELOGs, and the regenerated
#      registry churn lives. You review and merge it like any other PR.
#   2. Publishing happens here, triggered by a pushed `v*` tag. The tree at that
#      tag already carries the final versions, so this workflow only builds,
#      signs, publishes, and uploads artifacts — it does not run
#      `changeset version` and it does not commit anything back.
#
# Triggers:
#   - push tag `v*`          → publish packages at that tag (git read-only).
#   - workflow_dispatch      → manual escape hatch: publish packages from the
#                              dispatched ref and/or deploy the site.
#
# "If CI passes I can trigger a release": merge the Version PR (CI green) → a
# `v*` tag is created → this workflow publishes to npmjs.com.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "What to release"
        required: true
        default: "packages"
        type: choice
        options:
          - packages
          - site
          - all
      gate:
        description: "Gate level before publishing"
        required: false
        default: "quick"
        type: choice
        options:
          - quick
          - full
      dist_tag:
        description: "npm dist-tag to publish under"
        required: false
        default: "beta"
        type: choice
        options:
          - beta
          - latest

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ─── Determine what to do ──────────────────────────────────────────────────────
  # Tag push          → publish packages, gate=quick, dist-tag from tag shape.
  # Dispatch          → respect inputs.

  plan:
    runs-on: self-hosted-dfw-flex
    timeout-minutes: 45
    outputs:
      deploy_packages: ${{ steps.plan.outputs.deploy_packages }}
      deploy_site: ${{ steps.plan.outputs.deploy_site }}
      run_gate: ${{ steps.plan.outputs.run_gate }}
      gate_level: ${{ steps.plan.outputs.gate_level }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
    steps:
      - id: plan
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag-triggered publish. The tree at the tag is already versioned by
            # the merged Version PR, so publish packages with a quick gate.
            echo "deploy_packages=true" >> "$GITHUB_OUTPUT"
            echo "deploy_site=false" >> "$GITHUB_OUTPUT"
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
            echo "gate_level=quick" >> "$GITHUB_OUTPUT"

            # A tag like `v0.3.0` publishes `latest`; a pre-release tag like
            # `v0.3.0-beta.1` publishes `beta`.
            TAG="${GITHUB_REF_NAME}"
            if printf '%s' "$TAG" | grep -q -- '-'; then
              echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
            else
              echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            fi
          else
            # Manual dispatch.
            TARGET="${{ inputs.target }}"
            case "$TARGET" in
              packages)
                echo "deploy_packages=true" >> "$GITHUB_OUTPUT"
                echo "deploy_site=false" >> "$GITHUB_OUTPUT"
                ;;
              site)
                echo "deploy_packages=false" >> "$GITHUB_OUTPUT"
                echo "deploy_site=true" >> "$GITHUB_OUTPUT"
                ;;
              all)
                echo "deploy_packages=true" >> "$GITHUB_OUTPUT"
                echo "deploy_site=true" >> "$GITHUB_OUTPUT"
                ;;
            esac
            # Gate is required for package publishing, optional for site-only.
            if [ "$TARGET" = "site" ]; then
              echo "run_gate=false" >> "$GITHUB_OUTPUT"
            else
              echo "run_gate=true" >> "$GITHUB_OUTPUT"
            fi
            echo "gate_level=${{ inputs.gate }}" >> "$GITHUB_OUTPUT"
            echo "dist_tag=${{ inputs.dist_tag }}" >> "$GITHUB_OUTPUT"
          fi

  # ─── Guard: tag must match committed versions ──────────────────────────────────
  # A tag-triggered publish publishes whatever versions are committed at the tag.
  # This guard fails fast if the tag name does not correspond to a package
  # version present in the tree, catching a tag pushed before the Version PR
  # merged (the classic "published the wrong thing" footgun).

  verify-tag:
    needs: plan
    if: github.event_name == 'push'
    runs-on: self-hosted-dfw-flex
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert tag matches a committed package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG"
          MATCH=$(node -e '
            const { readdirSync, readFileSync, existsSync } = require("node:fs");
            const tag = process.argv[1];
            const dir = "packages";
            let found = false;
            for (const d of readdirSync(dir, { withFileTypes: true })) {
              if (!d.isDirectory()) continue;
              const p = `${dir}/${d.name}/package.json`;
              if (!existsSync(p)) continue;
              const pkg = JSON.parse(readFileSync(p, "utf8"));
              if (pkg.private) continue;
              if (pkg.version === tag) { found = true; break; }
            }
            process.stdout.write(found ? "yes" : "no");
          ' "$TAG")
          if [ "$MATCH" != "yes" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match any committed publishable package version ($TAG). Merge the Version PR before tagging."
            exit 1
          fi
          echo "Tag matches a committed package version."

  # ─── Exact-SHA qualification wait ─────────────────────────────────────────────
  # Use a GitHub-hosted runner for the wait so a single-capacity self-hosted
  # pool remains free to execute the package qualification being awaited.

  qualification:
    needs: [plan, verify-tag]
    if: >
      always() &&
      needs.plan.outputs.deploy_packages == 'true' &&
      (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Wait for exact-SHA required CI and release qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node tools/release-preflight.mjs
          --packages=false
          --site=false
          --verify-ci=true

  # ─── Fail-fast release preflight ──────────────────────────────────────────────
  # Validate target-specific credentials before dependency installation, builds,
  # or browser setup. The script uses only Node built-ins so this remains cheap.

  preflight:
    needs: [plan, verify-tag]
    if: >
      always() &&
      (needs.plan.outputs.deploy_packages == 'true' || needs.plan.outputs.deploy_site == 'true') &&
      (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped')
    runs-on: self-hosted-dfw-flex
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Validate release credentials and service access
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          REGISTRY_SIGN_KEY: ${{ secrets.REGISTRY_SIGN_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >
          node tools/release-preflight.mjs
          --packages=${{ needs.plan.outputs.deploy_packages }}
          --site=${{ needs.plan.outputs.deploy_site }}
          --verify-ci=false

  # ─── Gate ──────────────────────────────────────────────────────────────────────

  gate:
    needs: [plan, verify-tag, qualification, preflight]
    # verify-tag is skipped on dispatch; both exact-SHA qualification and
    # credential preflight must succeed before the expensive gate begins.
    if: >
      always() &&
      needs.plan.outputs.run_gate == 'true' &&
      needs.qualification.result == 'success' &&
      needs.preflight.result == 'success' &&
      (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped')
    runs-on: self-hosted-dfw-flex
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: chromium
      - run: pnpm nx run-many -t build --exclude=@solidiom/site
      - name: Run gate
        env:
          SOLIDIOM_GATE_REPORT_DIR: artifacts/gate-reports
        run: |
          if [ "${{ needs.plan.outputs.gate_level }}" = "full" ]; then
            pnpm run gate:full
          else
            pnpm run gate:quick
          fi
      - name: Upload gate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-diagnostics
          path: artifacts/gate-reports/
          if-no-files-found: ignore
          retention-days: 7

  # ─── Publish Packages ─────────────────────────────────────────────────────────
  # Git read-only. The tree is already at its final versions (from the merged
  # Version PR), so this job does NOT run `changeset version` and does NOT
  # commit or push anything. It builds, signs, publishes exactly what is
  # committed, and uploads immutable artifacts.

  publish-packages:
    needs: [plan, preflight, gate]
    if: >
      always() &&
      needs.plan.outputs.deploy_packages == 'true' &&
      needs.preflight.result == 'success' &&
      needs.gate.result == 'success'
    runs-on: self-hosted-dfw-flex
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Build packages
        run: pnpm nx run-many -t build --exclude=@solidiom/site

      # REG-008: Sign the registry index with Ed25519 (regenerates the signature
      # over the already-committed registry content; does not change versions).
      - name: Sign registry index
        env:
          REGISTRY_SIGN_KEY: ${{ secrets.REGISTRY_SIGN_KEY }}
        run: pnpm exec tsx tools/registry-build.ts

      - name: Verify signed registry index
        run: node packages/cli/dist/bin.js verify --registry

      # Publish the versions exactly as committed at this ref. No `changeset
      # version` — versioning already happened in the merged Version PR.
      - name: Publish packages
        run: pnpm changeset publish --tag ${{ needs.plan.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Generate and verify release artifacts (audit trail; not consumed by the CLI).
      - name: Generate beta artifacts
        run: pnpm exec tsx tools/generate-beta-artifacts.ts --verify

      - name: Verify beta signing
        env:
          REGISTRY_SIGN_KEY: ${{ secrets.REGISTRY_SIGN_KEY }}
        run: pnpm exec tsx tools/verify-beta-signing.ts

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            artifacts/beta-catalog.json
            artifacts/beta-pointer.json
            registry/index.json
          retention-days: 7

  # ─── Deploy Site ───────────────────────────────────────────────────────────────

  deploy-site:
    needs: [plan, preflight, gate, publish-packages]
    # Site-only dispatches do not run a package gate. Combined releases deploy
    # only after both qualification and package publication succeed; a skipped
    # publish caused by a failed gate must never authorize deployment.
    if: >
      always() &&
      needs.plan.outputs.deploy_site == 'true' &&
      needs.preflight.result == 'success' &&
      (needs.plan.outputs.deploy_packages == 'false' ||
        (needs.gate.result == 'success' && needs.publish-packages.result == 'success'))
    runs-on: self-hosted-dfw-flex
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Build packages for source resolution (site depends on primitive builds)
      - name: Build packages
        run: pnpm nx run-many -t build --exclude=@solidiom/site

      - name: Build templates
        run: pnpm --filter '@solidiom/template-*' build

      - name: Validate site structure
        run: |
          pnpm --filter @solidiom/site run boundaries
          pnpm --filter @solidiom/site run route-parity

      - name: Build site
        run: pnpm --filter @solidiom/site run build:deploy

      - name: Generate search index
        run: pnpm --filter @solidiom/site search-index

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: "4.129.0"
          command: pages deploy dist --project-name=solidiom-site --branch=main --commit-dirty=true
          workingDirectory: apps/site
