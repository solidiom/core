name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.34.5"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run gate:phase0

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Validate changesets without publishing (non-publishing validation path)
      - name: Check changeset status
        run: pnpm changeset status

      # Create release PR or publish (currently dry-run only for Phase 0)
      - name: Validate version plan
        run: pnpm changeset version --dry-run 2>&1 || echo "No changesets to version"

      # TODO: Enable actual publishing after Phase 0 exit
      # - name: Publish packages
      #   run: pnpm changeset publish
      #   env:
      #     NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
