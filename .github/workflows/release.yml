name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run gate:phase0

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # REG-008: Sign the registry index with Ed25519 over the published artifact.
      # The build produces a deterministic, unsigned registry. This step adds the
      # asymmetric signature using the REGISTRY_SIGN_KEY secret (raw Ed25519 private
      # key as 64 hex chars). The signed index is then ready for distribution.
      - name: REG-008 — sign registry index
        env:
          REGISTRY_SIGN_KEY: ${{ secrets.REGISTRY_SIGN_KEY }}
        run: pnpm exec tsx tools/registry-build.ts

      - name: REG-008 — verify signed registry index
        run: node packages/cli/dist/bin.js verify --registry

      # Validate changesets without publishing (non-publishing validation path)
      - name: Check changeset status
        run: pnpm changeset status

      # Create release PR or publish (currently dry-run only for Phase 0)
      - name: Validate version plan
        run: pnpm changeset version --dry-run 2>&1 || echo "No changesets to version"

      # TODO: Enable actual publishing after Phase 0 exit
      # - name: Publish packages
      #   run: pnpm changeset publish
      #   env:
      #     NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
