name: Solid Compatibility Matrix

# Runs the full test suite against multiple SolidJS beta versions to detect
# compatibility regressions. Separated from the main CI workflow because:
# 1. It uses --no-frozen-lockfile (modifies dependency versions)
# 2. It's a 6-job matrix (3 tiers × 2 Node versions) that adds ~30 min
# 3. The pinned Solid version doesn't change between PRs
#
# Runs nightly and on manual dispatch. Can be re-added to PR CI if needed.

on:
  schedule:
    # Every day at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: solid-compat-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  test-solid-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solid-tier: [low, mid, high]
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          frozen-lockfile: "false"
      - run: node scripts/set-solid-version.mjs ${{ matrix.solid-tier }}
      - run: pnpm install --no-frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright (all browsers)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      - run: pnpm exec nx run-many -t build --exclude=@solidiom/site
      - run: pnpm exec nx run-many -t test --exclude=@solidiom/tests-package-source-parity,@solidiom/site
      - run: pnpm exec vitest run --config vitest.browser.config.ts
