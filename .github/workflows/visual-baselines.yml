name: Visual Baselines

# TEST-005: regenerate the visual regression baselines inside the same pinned
# Playwright image that `site-visual` uses in ci.yml.
#
# Baselines are environment-sensitive: font rasterisation differs between macOS
# and Linux, so a baseline captured on a contributor's machine will not match
# what CI renders. This workflow exists so baselines can be produced in the
# canonical environment without requiring Docker locally.
#
# Usage:
#   1. Dispatch this workflow from the Actions tab (or `gh workflow run`).
#   2. Download the `visual-baselines` artifact from the run.
#   3. Unzip it over apps/site/tests/visual/__screenshots__/.
#   4. Review the diff — every changed image is an intentional visual change.
#   5. Commit.
#
# Contributors who do have Docker can skip this and run
# `pnpm run visual:update:container`, which uses the identical image.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the baselines are being regenerated (recorded in the run)"
        required: true
        type: string

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.34.5
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  regenerate:
    runs-on: solidiom-dfw-runner
    # Must track the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - name: Record reason
        env:
          REASON: ${{ inputs.reason }}
        run: echo "Regenerating visual baselines — $REASON"

      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the site under test
        run: pnpm --filter @solidiom/site build && pnpm --filter @solidiom/site search-index

      # Browsers ship with the image; PLAYWRIGHT_USE_EXISTING_BUILD reuses the
      # dist built above instead of rebuilding inside the webServer timeout.
      - name: Capture baselines
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"
        run: pnpm --filter @solidiom/site run test:visual:update

      - name: Summarise
        run: |
          COUNT=$(find apps/site/tests/visual/__screenshots__ -name '*.png' | wc -l | tr -d ' ')
          echo "Captured $COUNT baseline images." >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "Changed relative to the committed baselines:"
            echo '```'
            git -c safe.directory='*' status --short -- apps/site/tests/visual/__screenshots__ || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: visual-baselines
          path: apps/site/tests/visual/__screenshots__
          retention-days: 14
