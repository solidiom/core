name: Version PR
permissions:
  contents: read

# Step 1 of the two-step release model (see release.yml for step 2).
#
# This workflow applies pending changesets and opens a single, reviewable
# "Version PR" that contains ALL of the release churn:
#   - packages/*/package.json version bumps
#   - packages/*/CHANGELOG.md updates
#   - the regenerated (and re-signed) registry/index.json + per-entry manifests
#   - pnpm-lock.yaml updates from internal dependency version bumps
#
# Nothing is published here and nothing is pushed to main directly. You review
# the PR and merge it. The post-merge workflow then creates a unique immutable
# release marker and explicitly dispatches release.yml on the exact merge SHA.
# Package versions remain independent; no global package version is inferred.
#
# Trigger: manual dispatch. Run it whenever you want to cut a release from the
# accumulated Changesets on the base branch.

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base branch to open the Version PR against"
        required: false
        default: "main"
        type: string

concurrency:
  group: version-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  version:
    runs-on: self-hosted-dfw-flex
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.base }}

      - uses: ./.github/actions/setup

      - name: Check for pending changesets
        id: changesets
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv "README.md"; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No pending changesets found — nothing to version."
          fi

      - name: Apply changeset versions
        if: steps.changesets.outputs.pending == 'true'
        run: pnpm changeset version

      # The registry embeds a per-entry version copied from each package.json,
      # so regenerate (and re-sign) it in the same PR the versions changed in.
      # Build first because registry-build reads built package metadata.
      - name: Build packages
        if: steps.changesets.outputs.pending == 'true'
        run: pnpm nx run-many -t build --exclude=@solidiom/site

      - name: Regenerate and sign registry index
        if: steps.changesets.outputs.pending == 'true'
        env:
          REGISTRY_SIGN_KEY: ${{ secrets.REGISTRY_SIGN_KEY }}
        run: pnpm exec tsx tools/registry-build.ts

      - name: Verify signed registry index
        if: steps.changesets.outputs.pending == 'true'
        run: node packages/cli/dist/bin.js verify --registry

      # Regenerate a11y evidence so the "no stale generated artifacts" CI gate
      # passes on the Version PR (that gate checks registry/ and source/ trees).
      - name: Refresh generated artifacts
        if: steps.changesets.outputs.pending == 'true'
        run: |
          pnpm run report:a11y-evidence || true
          pnpm run source:emit

      - name: Create Version PR
        if: steps.changesets.outputs.pending == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ inputs.base }}
          branch: release/version-${{ github.run_id }}
          commit-message: "chore(release): version packages"
          title: "chore(release): version packages"
          body: |
            Automated **Version PR** — applies pending Changesets and regenerates the release artifacts.

            This PR contains all release churn (independent package versions, changelogs, regenerated and re-signed registry, and lockfile). Review it as you would any PR.

            **Merging this PR creates an immutable `release-pr-<PR>-<SHA12>` marker and explicitly dispatches the package-and-site release at the exact merge SHA.** The release fails closed if no unpublished package versions are present.
          labels: |
            release
          delete-branch: true
