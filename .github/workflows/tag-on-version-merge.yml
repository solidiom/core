name: Release on Version PR merge
permissions:
  contents: read

# Bridges the two-step release model without pretending independently versioned
# packages share one global semver. A merged Version PR gets a unique immutable
# marker (`release-pr-<PR>-<SHA12>`), then release.yml is explicitly dispatched
# on that tag with the full expected SHA. The explicit dispatch is required
# because pushes made with GITHUB_TOKEN do not reliably start downstream runs.

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-on-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/version-')
    runs-on: self-hosted-dfw-flex
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Resolve immutable release marker and npm channel
        id: release
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process")
          const { appendFileSync, readFileSync } = require("node:fs")

          const head = process.env.MERGE_SHA
          const ignored = new Set(JSON.parse(readFileSync(".changeset/config.json", "utf8")).ignore ?? [])
          const paths = execFileSync(
            "git",
            ["diff", "--name-only", `${head}^1`, head, "--", "packages/*/package.json"],
            { encoding: "utf8" },
          ).trim().split("\n").filter(Boolean)

          const changed = []
          for (const path of paths) {
            const after = JSON.parse(readFileSync(path, "utf8"))
            if (!after.name || !after.version || after.private || ignored.has(after.name)) continue
            let before
            try {
              before = JSON.parse(execFileSync("git", ["show", `${head}^1:${path}`], { encoding: "utf8" }))
            } catch {
              before = null
            }
            if (before?.version !== after.version) changed.push({ name: after.name, version: after.version })
          }

          if (changed.length === 0) {
            console.error("::error::Merged Version PR contains no publishable package version changes")
            process.exit(1)
          }

          const channel = changed.some(({ version }) => version.includes("-")) ? "beta" : "latest"
          const shortSha = head.slice(0, 12)
          const tag = `release-pr-${process.env.PR_NUMBER}-${shortSha}`
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nchannel=${channel}\npackage_count=${changed.length}\n`)
          console.log(`Release marker: ${tag}`)
          console.log(`npm channel: ${channel}`)
          console.log(`Changed packages (${changed.length}): ${changed.map(({ name, version }) => `${name}@${version}`).join(", ")}`)
          NODE

      - name: Create collision-safe release marker
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            EXISTING_SHA="$(git rev-parse "$TAG^{commit}")"
            if [ "$EXISTING_SHA" != "$MERGE_SHA" ]; then
              echo "::error::Release marker collision: $TAG points to $EXISTING_SHA, expected $MERGE_SHA"
              exit 1
            fi
            echo "Release marker $TAG already points to the expected SHA."
          else
            git tag "$TAG" "$MERGE_SHA"
            git push origin "refs/tags/$TAG"
            echo "Created $TAG at $MERGE_SHA."
          fi

      - name: Dispatch exact-SHA package and site release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          EXPECTED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          node <<'NODE'
          const api = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            "X-GitHub-Api-Version": "2022-11-28",
          }
          const existing = await fetch(
            `${api}/actions/workflows/release.yml/runs?branch=${encodeURIComponent(process.env.RELEASE_TAG)}&event=workflow_dispatch&per_page=10`,
            { headers },
          )
          if (!existing.ok) throw new Error(`Could not inspect existing release runs (HTTP ${existing.status})`)
          const runs = await existing.json()
          if (runs.workflow_runs?.some((run) => run.head_sha === process.env.EXPECTED_SHA)) {
            console.log(`Release already dispatched for ${process.env.RELEASE_TAG}; not creating a duplicate.`)
            process.exit(0)
          }

          const response = await fetch(`${api}/actions/workflows/release.yml/dispatches`, {
            method: "POST",
            headers,
            body: JSON.stringify({
              ref: process.env.RELEASE_TAG,
              inputs: {
                target: "all",
                gate: "quick",
                dist_tag: process.env.RELEASE_CHANNEL,
                expected_sha: process.env.EXPECTED_SHA,
              },
            }),
          })
          if (response.status !== 204) {
            throw new Error(`Could not dispatch release workflow (HTTP ${response.status})`)
          }
          console.log(`Dispatched package-and-site release for ${process.env.RELEASE_TAG}.`)
          NODE

      - name: Summarize release dispatch
        env:
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          PACKAGE_COUNT: ${{ steps.release.outputs.package_count }}
        run: |
          {
            echo "### Release dispatched"
            echo "- Marker: \`$TAG\`"
            echo "- npm channel: \`$CHANNEL\`"
            echo "- Changed packages: $PACKAGE_COUNT"
            echo "- Target: packages and site"
          } >> "$GITHUB_STEP_SUMMARY"
