name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

  format:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: REG-006 — verify registry catalog integrity
        run: node packages/cli/dist/bin.js verify --registry
      - name: API-004 — verify vertical-slice primitive API coverage
        run: pnpm run api:coverage-gate
      - name: RECIPE-006 / CLI-001 — verify package src/source parity and exports
        run: pnpm run audit:package-source-parity
      - name: THEME-002/003/004 — verify generated theme output is current
        run: |
          pnpm run theme:emit:css:check
          pnpm run theme:emit:tailwind:check
          pnpm run theme:emit:unocss:check
      - name: THEME-005 — theme cross-output parity, contrast, and round-trip audit
        run: pnpm run audit:theme-parity
      - name: PRESET-005 — cross-preset contrast, coverage, and translation gate
        run: pnpm run audit:preset-themes
      - name: CLI-003 — assert no unverified provenance lock entries
        run: pnpm run assert:no-unverified
      # Registry index signing deliberately does NOT run here. It rewrote the
      # committed registry/index.json with signature/signedAt/signatureKeyId,
      # which BUILD-001 then reported as stale — and it cannot be satisfied by
      # committing the signed copy, because any build without the secret strips
      # it again. The committed registry is a deterministic build output; a
      # secret-derived signature belongs to the published copy. Nothing consumes
      # the signature today (there is no packages/registry and nothing publishes
      # registry/), so signing here produced a value that was discarded at job
      # end. Tracked as REG-008: sign in the release workflow, over the published
      # artifact, and move the index off HMAC to asymmetric signing.
      - name: BUILD-001 — verify no generated artifacts are stale
        run: |
          PATHSPEC=(registry/ 'packages/*/source/' 'packages/*/docs/accessibility/evidence.json')

          if git diff --quiet -- "${PATHSPEC[@]}"; then
            echo "Generated artifacts are current."
            exit 0
          fi

          echo "::group::Stale paths"
          git diff --stat -- "${PATHSPEC[@]}"
          echo "::endgroup::"

          echo "::group::Diff (first 200 lines)"
          git diff -- "${PATHSPEC[@]}" | head -200
          echo "::endgroup::"

          # Distinguish real staleness from a determinism regression. Generation
          # stamps are preserved whenever content is unchanged, so a
          # timestamp-only diff points at that logic rather than at stale content.
          SUBSTANTIVE=$(git diff -U0 -- "${PATHSPEC[@]}" \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -cvE '"(lastGenerated|lastUpdated|generatedAt|signedAt)":' || true)

          if [ "$SUBSTANTIVE" -eq 0 ]; then
            echo "::error::Generated artifacts differ only in generation timestamps. That is a determinism regression in tools/registry-build.ts (withStableManifestStamps / withStableIndexStamp), not stale content — the stamps must be preserved when content is unchanged."
          else
            echo "::error::Generated artifacts are stale ($SUBSTANTIVE substantive changed lines). Run 'pnpm build && pnpm run report:a11y-evidence && pnpm run registry:build' and commit the changes."
          fi
          exit 1

  test-node:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - run: pnpm test
      # `pnpm test` is `nx run-many -t test`, which runs each project's own
      # suite. tools/ is not an nx project, so its 35 test files ran nowhere —
      # 17 of them were invoked by nothing at all, and the 18 that were are
      # hand-listed inside phase1-gate.ts, a list that had already drifted.
      # This covers all of them from the glob in vitest.config.ts, so a new
      # tools test is picked up without editing a list.
      - run: pnpm run test:tools

  test-browser:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: pnpm exec vitest run --config vitest.browser.config.ts
      - name: RECIPE-005 — computed-style parity across css/tailwind/unocss profiles
        run: pnpm run test:recipe-parity
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-traces
          path: test-results/
          retention-days: 7

  test-solid-matrix:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        solid-tier: [low, mid, high]
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: node scripts/set-solid-version.mjs ${{ matrix.solid-tier }}
      - run: pnpm install --no-frozen-lockfile
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: pnpm exec nx run-many -t build --exclude=@solidiom/docs,@solidiom/docs-astro-poc,@solidiom/site
      - run: pnpm exec nx run-many -t test --exclude=@solidiom/tests-package-source-parity,@solidiom/site
      - run: pnpm exec vitest run --config vitest.browser.config.ts

  a11y-axe-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - name: Run executable axe accessibility scans
        run: pnpm run test:a11y
      - name: Publish stable per-primitive accessibility evidence
        run: pnpm run report:a11y-evidence
      - name: A11Y-004 — verify GA-status primitive accessibility evidence is current
        run: pnpm run a11y:coverage-gate
      - name: Generate axe report from the executed result artifact
        run: pnpm run report:axe
      - uses: actions/upload-artifact@v6
        with:
          name: axe-scan-results
          path: |
            artifacts/axe-results.json
            artifacts/a11y-evidence.json
            docs/axe-scan-results.md
          retention-days: 30

  # ─── CI-002: Site Check/Build/E2E ───────────────────────────────────────────

  site-check:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solidiom/site check
      - run: pnpm --filter @solidiom/site run boundaries
      - run: pnpm --filter @solidiom/site run i18n:validate

  site-build:
    needs: [install, site-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Build and index static site
        run: pnpm --filter @solidiom/site build && pnpm --filter @solidiom/site search-index
      - name: REG-007 — verify every registry deliverable has exactly one valid route
        run: pnpm --filter @solidiom/site run registry-route-check
      - uses: actions/upload-artifact@v6
        with:
          name: site-dist
          path: apps/site/dist

  site-e2e:
    needs: site-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - run: npx playwright install --with-deps chromium firefox webkit
      - env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"
        run: pnpm --filter @solidiom/site run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: site-e2e-results
          path: test-results/site-e2e
          retention-days: 7

  # ─── CI-003: Visual/Lighthouse CI (Advisory Mode) ──────────────────────────────

  # TEST-005: runs inside the pinned Playwright image so screenshot rendering is
  # reproducible. Baselines are environment-sensitive — font rasterisation
  # differs between macOS and Linux — so they can only be verified or approved
  # against a fixed environment. The image tag MUST track the @playwright/test
  # version in package.json, or the bundled browser build will not match.
  #
  # Regenerate baselines with `pnpm run visual:update:container` locally, or by
  # dispatching .github/workflows/visual-baselines.yml if Docker is unavailable.
  # Blocking as of run 30871761546, the first in which it executed and passed.
  # It was advisory while the committed baselines were captured on macOS and
  # could not reproduce here — and being advisory is how a 36-baseline mismatch
  # went unnoticed for several commits, since an advisory failure reads much like
  # an advisory pass in a run summary (§11). With the environment pinned there is
  # no longer a platform excuse for a diff, so a diff should fail the build.
  site-visual:
    needs: site-build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      # Browsers ship with the image at PLAYWRIGHT_BROWSERS_PATH; installing
      # again would fetch a second copy and can shadow the bundled build.
      - env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"
        run: pnpm --filter @solidiom/site run test:visual
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: site-visual-diffs
          path: test-results/site-visual
          retention-days: 7

  site-lighthouse:
    needs: site-build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - name: Install Chrome for Lighthouse
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Start static-site preview for Lighthouse
        run: pnpm --filter @solidiom/site preview --host 127.0.0.1 --port 4322 > /dev/null 2>&1 & for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4322/ > /dev/null && exit 0; sleep 1; done; exit 1
      - run: pnpm --filter @solidiom/site run lighthouse:json
      - uses: actions/upload-artifact@v6
        with:
          name: site-lighthouse-report
          path: apps/site/dist/reports
          retention-days: 30

  # ─── CLI-008: Offline create/install/typecheck/build/test smoke matrix ────
  #
  # Split into a prep job and an offline matrix. The prep job is the only part
  # with network access to a registry: it warms a Verdaccio storage snapshot by
  # running the full matrix once through an npmjs uplink. The matrix jobs then
  # restore that snapshot and run with no uplink at all, so a package missing
  # from the snapshot 404s instead of silently resolving from npmjs.
  #
  # The snapshot must be built on the same runner OS that consumes it: it holds
  # the platform-native optionalDependencies (@tailwindcss/oxide-*,
  # lightningcss-*) that Yarn Classic insists on resolving, and those differ per
  # platform. Hence runner.os in the cache key.

  cli-smoke-create-prep:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Enable corepack (yarn)
        run: corepack enable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Skip the warm-up entirely when a valid snapshot is already cached.
      - uses: actions/cache/restore@v5
        id: snapshot-probe
        with:
          path: tools/offline-fixture/.registry-snapshot
          key: offline-registry-snapshot-${{ runner.os }}-${{ hashFiles('templates/*/package.json', 'pnpm-lock.yaml') }}
          lookup-only: true
      - name: CLI-008 — warm the offline registry snapshot (network required)
        if: steps.snapshot-probe.outputs.cache-hit != 'true'
        run: tools/offline-fixture/run-offline-test.sh --prep
      - uses: actions/cache/save@v5
        if: steps.snapshot-probe.outputs.cache-hit != 'true'
        with:
          path: tools/offline-fixture/.registry-snapshot
          key: offline-registry-snapshot-${{ runner.os }}-${{ hashFiles('templates/*/package.json', 'pnpm-lock.yaml') }}

  cli-smoke-create:
    needs: [build, cli-smoke-create-prep]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Yarn: corepack ships with actions/setup-node's bundled Node and is
      # already on PATH; `corepack enable` activates the yarn/pnpm shims the
      # same way this repo's local mise-managed dev environment does (see
      # tools/smoke-create.ts's own header comment on cwd-based shim
      # activation — the CI runner's cwd is the checkout root throughout the
      # job, so this is sufficient here without any of the local
      # packageManager-field workaround smoke-create.ts needs for its
      # isolated temp dirs).
      - name: Enable corepack (yarn)
        run: corepack enable
      # Bun: no existing step in this file sets up bun. oven-sh/setup-bun is
      # the current maintained action for this, pinned to an exact major
      # version to match this file's existing actions/*@vN convention.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache/restore@v5
        with:
          path: tools/offline-fixture/.registry-snapshot
          key: offline-registry-snapshot-${{ runner.os }}-${{ hashFiles('templates/*/package.json', 'pnpm-lock.yaml') }}
          fail-on-cache-miss: true
      - name: CLI-008 — cold-cache offline create/install/typecheck/build/test (${{ matrix.manager }})
        run: |
          mkdir -p artifacts
          tools/offline-fixture/run-offline-test.sh \
            --manager ${{ matrix.manager }} \
            --smoke-json-out artifacts/smoke-create-${{ matrix.manager }}.json
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: smoke-create-${{ matrix.manager }}-results
          path: artifacts/smoke-create-${{ matrix.manager }}.json
          retention-days: 7

  # ─── BETA-002 / G3: public-beta acceptance evidence ────────────────────────────
  #
  # BETA-002's acceptance matrix. Until now these existed only as package.json
  # scripts that no workflow invoked, so nothing ever re-checked G3's central
  # claim — which is how the M3 rollup in docs/plans/website-tasks.md drifted out
  # of sync with the repository for several commits while every task row read [x].
  #
  # Wired by verified state rather than uniformly:
  #
  #   * beta-acceptance-report is blocking. It passes 60/60 and reads
  #     apps/site/dist directly, so it needs no preview server.
  #   * beta-acceptance-e2e is blocking. It passes 111/111 across Chromium,
  #     Firefox, and WebKit (locale parity, theme modes, search, tools, and
  #     axe-core no_critical_violations). Previously advisory while A11Y-008's
  #     color-contrast defect was open; promoted to blocking after A11Y-008
  #     fixed --sol-secondary to 5.17:1 (CI-007).

  beta-acceptance-report:
    needs: site-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - name: BETA-002 — static-build acceptance report
        run: pnpm run beta:acceptance:report

  beta-acceptance-e2e:
    needs: site-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: BETA-002 — cross-browser acceptance matrix (advisory, see A11Y-008)
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"
        run: pnpm run beta:acceptance:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: beta-acceptance-e2e-results
          path: test-results/beta-acceptance
          retention-days: 7

  # ─── Gate Jobs ─────────────────────────────────────────────────────────────────

  phase1-gate:
    needs: [typecheck, build, test-node, test-browser, a11y-axe-scan, site-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm run gate:phase1

  phase2-gate:
    needs: [phase1-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run gate:phase2

  phase0-gate:
    needs: [typecheck, build, test-node, test-browser, a11y-axe-scan, phase1-gate, phase2-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run gate:phase0
      - uses: actions/upload-artifact@v6
        with:
          name: phase0-gate-output
          path: docs/phase0-gate-result.txt
          retention-days: 30

  # tools/phase3-gate.ts gates the *library's* beta release (Solid 2 beta
  # compatibility, compile-time transforms, prerelease metadata) — it is NOT the
  # website's G3 milestone gate, despite the numeric coincidence. See
  # docs/plans/website-tasks.md §3.1 for the two numbering schemes.
  #
  # Blocking since A11Y-007: all §1 artifacts (AT template, AT results directory,
  # axe-scan-results, keyboard-audit-results) and §4 cross-browser results are
  # recorded. Its §0 re-runs the phase 0/1/2 gates, hence the dependency on them.
  phase3-gate:
    needs: [phase1-gate, phase2-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - name: Phase 3 (library beta) gate
        run: pnpm run gate:phase3

  # VS-004's gate, the executable half of the G2 exit checklist. It existed as
  # tools/vertical-slice-gate.ts but was referenced by no script, workflow, or phase
  # gate, so the "67/67 passing" figure recorded in docs/plans/website-tasks.md §11
  # was unverifiable — and its §11 bulk-catalog-bypass check had silently stopped
  # running entirely after the tracker moved to docs/plans/. Blocking, because it
  # passes 67/67.
  vertical-slice-gate:
    needs: [build, site-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: VS-004 — vertical-slice gate (G2)
        run: pnpm run gate:vertical-slice
