name: CI

# Tiered CI pipeline:
#   - PR:   Fast feedback (format, typecheck, build, node tests on single version, chromium browser tests)
#   - Main: Full matrix (node 24+26, chromium browser tests, a11y, CLI smoke, site build+e2e, gates)
#   - Dispatch: Configurable (affected_only, full_matrix options)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      affected_only:
        description: "Run only affected packages (uses nx affected)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      full_matrix:
        description: "Run the full test matrix even on dispatch (like main push)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"
  NODE_OPTIONS: "--max-old-space-size=4096"
  NX_BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
  NX_HEAD: HEAD
  # PRs always run the fast tier. Main pushes and full manual dispatches run the
  # comprehensive tier; a manual run can set full_matrix=false for fast feedback.

jobs:
  # ─── Foundation ────────────────────────────────────────────────────────────────

  install:
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
            tools/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

  # ─── Lint & Typecheck (always run, no build needed) ────────────────────────────

  format:
    needs: install
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  typecheck:
    needs: install
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  # ─── Build ────────────────────────────────────────────────────────────────────

  build:
    needs: install
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build packages
        run: |
          if [ "${{ inputs.affected_only }}" = "true" ]; then
            pnpm nx affected -t build --exclude=@solidiom/site
          else
            pnpm nx run-many -t build --exclude=@solidiom/site
          fi

      # Post-build audits
      - name: REG-006 — verify registry catalog integrity
        run: node packages/cli/dist/bin.js verify --registry
      - name: API-004 — verify vertical-slice primitive API coverage
        run: pnpm run api:coverage-gate
      - name: Verify package src/source parity and exports
        run: pnpm run audit:package-source-parity
      - name: Verify generated theme output is current
        run: |
          pnpm run theme:emit:css:check
          pnpm run theme:emit:tailwind:check
          pnpm run theme:emit:unocss:check
      - name: Theme cross-output parity and contrast audit
        run: pnpm run audit:theme-parity
      - name: Cross-preset contrast, coverage, and translation gate
        run: pnpm run audit:preset-themes
      - name: Assert no unverified provenance lock entries
        run: pnpm run assert:no-unverified
      - name: Verify no generated artifacts are stale
        run: |
          PATHSPEC=(registry/ 'packages/*/source/' 'packages/*/docs/accessibility/evidence.json')
          if git diff --quiet -- "${PATHSPEC[@]}"; then
            echo "Generated artifacts are current."
            exit 0
          fi
          echo "::group::Stale paths"
          git diff --stat -- "${PATHSPEC[@]}"
          echo "::endgroup::"
          SUBSTANTIVE=$(git diff -U0 -- "${PATHSPEC[@]}" \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -cvE '"(lastGenerated|lastUpdated|generatedAt|signedAt)":' || true)
          if [ "$SUBSTANTIVE" -eq 0 ]; then
            echo "::error::Generated artifacts differ only in timestamps — determinism regression."
          else
            echo "::error::Generated artifacts are stale ($SUBSTANTIVE changed lines). Run 'pnpm build && pnpm run report:a11y-evidence && pnpm run registry:build' and commit."
          fi
          exit 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-dist
          path: |
            packages/*/dist
            apps/*/dist
            !apps/site/dist
          retention-days: 1

  # ─── Tests (Node) ─────────────────────────────────────────────────────────────
  # PR: single Node version. Main/dispatch: matrix [24, 26].

  test-node:
    needs: build
    runs-on: solidiom-dfw-runner
    strategy:
      matrix:
        node-version: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true')) && fromJson('[24, 26]') || fromJson('[24]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          playwright: chromium
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - run: |
          if [ "${{ inputs.affected_only }}" = "true" ]; then
            pnpm nx affected -t test --exclude=@solidiom/site
          else
            pnpm test
          fi
      - run: pnpm run test:tools

  # ─── Tests (Browser) ──────────────────────────────────────────────────────────
  # PR: Chromium only. Main/dispatch: Chromium only (full 3-browser in nightly).

  test-browser:
    needs: build
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: chromium
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - name: Browser component tests (Chromium)
        env:
          VITEST_BROWSERS: chromium
        run: pnpm exec vitest run --config vitest.browser.config.ts
      - name: Recipe parity test
        run: pnpm run test:recipe-parity
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-traces
          path: test-results/
          retention-days: 7

  # ─── Accessibility (main/dispatch only) ────────────────────────────────────────

  a11y-axe-scan:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true')
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: chromium
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - run: pnpm run test:a11y
      - run: pnpm run report:a11y-evidence
      - run: pnpm run a11y:coverage-gate
      - run: pnpm run report:axe
      - uses: actions/upload-artifact@v6
        with:
          name: axe-scan-results
          path: |
            artifacts/axe-results.json
            artifacts/a11y-evidence.json
            docs/axe-scan-results.md
          retention-days: 30

  # ─── Site Pipeline (main/dispatch only) ────────────────────────────────────────

  site-check:
    needs: install
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true')
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @solidiom/site check
      - run: pnpm --filter @solidiom/site run boundaries
      - run: pnpm --filter @solidiom/site run i18n:validate

  site-build:
    needs: [install, site-check]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true')
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build template previews
        run: pnpm --filter '@solidiom/template-*' build
      - name: Build and index static site
        run: pnpm --filter @solidiom/site build && pnpm --filter @solidiom/site search-index
      - name: Verify registry routes
        run: pnpm --filter @solidiom/site run registry-route-check
      - uses: actions/upload-artifact@v6
        with:
          name: site-dist
          path: apps/site/dist

  site-e2e:
    needs: site-build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true')
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: chromium firefox webkit
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"
        run: pnpm --filter @solidiom/site run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: site-e2e-results
          path: test-results/site-e2e
          retention-days: 7

  site-visual:
    needs: site-build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true')
    runs-on: solidiom-dfw-runner
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"
        run: pnpm --filter @solidiom/site run test:visual
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: site-visual-diffs
          path: test-results/site-visual
          retention-days: 7

  site-lighthouse:
    needs: site-build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true')
    runs-on: solidiom-dfw-runner
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Start preview server
        run: |
          pnpm --filter @solidiom/site preview --host 127.0.0.1 --port 4322 > /dev/null 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4322/ > /dev/null && exit 0; sleep 1; done; exit 1
      - run: pnpm --filter @solidiom/site run lighthouse:json
      - uses: actions/upload-artifact@v6
        with:
          name: site-lighthouse-report
          path: apps/site/dist/reports
          retention-days: 30

  # ─── CLI Smoke Tests (main/dispatch only) ──────────────────────────────────────

  cli-smoke-create-prep:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true')
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - run: corepack enable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache/restore@v5
        id: snapshot-probe
        with:
          path: tools/offline-fixture/.registry-snapshot
          key: offline-registry-snapshot-${{ runner.os }}-${{ hashFiles('templates/*/package.json', 'pnpm-lock.yaml') }}
          lookup-only: true
      - name: Warm offline registry snapshot
        if: steps.snapshot-probe.outputs.cache-hit != 'true'
        run: tools/offline-fixture/run-offline-test.sh --prep
      - uses: actions/cache/save@v5
        if: steps.snapshot-probe.outputs.cache-hit != 'true'
        with:
          path: tools/offline-fixture/.registry-snapshot
          key: offline-registry-snapshot-${{ runner.os }}-${{ hashFiles('templates/*/package.json', 'pnpm-lock.yaml') }}

  cli-smoke-create:
    needs: [build, cli-smoke-create-prep]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true')
    runs-on: solidiom-dfw-runner
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - run: corepack enable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache/restore@v5
        with:
          path: tools/offline-fixture/.registry-snapshot
          key: offline-registry-snapshot-${{ runner.os }}-${{ hashFiles('templates/*/package.json', 'pnpm-lock.yaml') }}
          fail-on-cache-miss: true
      - name: Offline create/install/typecheck/build/test (${{ matrix.manager }})
        run: |
          mkdir -p artifacts
          tools/offline-fixture/run-offline-test.sh \
            --manager ${{ matrix.manager }} \
            --smoke-json-out artifacts/smoke-create-${{ matrix.manager }}.json
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: smoke-create-${{ matrix.manager }}-results
          path: artifacts/smoke-create-${{ matrix.manager }}.json
          retention-days: 7

  # ─── Preview Deploy (PRs only) ────────────────────────────────────────────────

  preview-deploy:
    needs: [install]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: solidiom-dfw-runner
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build template previews
        run: pnpm --filter '@solidiom/template-*' build
      - name: Build and index site
        run: pnpm --filter @solidiom/site build && pnpm --filter @solidiom/site search-index
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=solidiom-site
          workingDirectory: apps/site
      - name: Verify preview delivery policy
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: pnpm --filter @solidiom/site verify:preview
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.DEPLOY_URL;
            const body = `## Preview Deployment\n\n**URL:** ${url}\n\nDeployed from commit \`${context.sha.slice(0, 7)}\`.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('Preview Deployment'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  # ─── Catalog & Vertical Slice Gates (main/dispatch only) ───────────────────────

  catalog-gates:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true')
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - run: pnpm run component:catalog-gate
      - run: pnpm run block:catalog-gate

  vertical-slice-gate:
    needs: [build, site-check]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true')
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - run: pnpm run gate:vertical-slice

  # ─── Quality Gate (final) ──────────────────────────────────────────────────────
  # PR: lightweight gate (format + typecheck + build + tests pass).
  # Main/dispatch: full gate suite including all phases.

  gate:
    # `always()` lets the fast tier proceed when full-tier jobs are intentionally
    # skipped; the explicit result checks still prevent a gate after a failure.
    needs: [typecheck, build, test-node, test-browser, a11y-axe-scan, site-e2e, catalog-gates]
    if: >
      always() &&
      needs.typecheck.result == 'success' &&
      needs.build.result == 'success' &&
      needs.test-node.result == 'success' &&
      needs.test-browser.result == 'success' &&
      (!(github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true')) ||
        (needs.a11y-axe-scan.result == 'success' &&
          needs.site-e2e.result == 'success' &&
          needs.catalog-gates.result == 'success'))
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: chromium
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - name: Gate — quick
        if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.full_matrix != 'true')
        run: pnpm run gate:quick
      - name: Gate — full
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true')
        run: pnpm run gate:full
