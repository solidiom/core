name: CI

# Automatic triggers are disabled on request: this workflow runs only when
# dispatched explicitly (Actions tab or `gh workflow run ci.yml`). Restore the
# push/pull_request triggers below to re-arm CI-001.
#
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
on:
  workflow_dispatch:
    inputs:
      affected_only:
        description: "Run only affected packages (faster, uses nx affected)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"
  NODE_OPTIONS: "--max-old-space-size=4096"
  # For nx affected: compare against main branch by default.
  # In PRs this is automatically set to the merge base.
  NX_BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
  NX_HEAD: HEAD

jobs:
  # ─── Foundation ────────────────────────────────────────────────────────────────

  install:
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
            tools/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

  # ─── Lint & Typecheck (parallel, no build needed) ──────────────────────────────

  format:
    needs: install
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  typecheck:
    needs: install
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  # ─── Build ────────────────────────────────────────────────────────────────────
  # Single build that uploads artifacts for all downstream consumers.

  build:
    needs: install
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build packages
        run: |
          if [ "${{ inputs.affected_only }}" = "true" ]; then
            echo "Building affected packages only (NX_BASE=$NX_BASE)"
            pnpm nx affected -t build --exclude=@solidiom/site
          else
            pnpm nx run-many -t build --exclude=@solidiom/site
          fi

      # Post-build audits that verify generated output integrity
      - name: REG-006 — verify registry catalog integrity
        run: node packages/cli/dist/bin.js verify --registry
      - name: API-004 — verify vertical-slice primitive API coverage
        run: pnpm run api:coverage-gate
      - name: RECIPE-006 / CLI-001 — verify package src/source parity and exports
        run: pnpm run audit:package-source-parity
      - name: THEME-002/003/004 — verify generated theme output is current
        run: |
          pnpm run theme:emit:css:check
          pnpm run theme:emit:tailwind:check
          pnpm run theme:emit:unocss:check
      - name: THEME-005 — theme cross-output parity, contrast, and round-trip audit
        run: pnpm run audit:theme-parity
      - name: PRESET-005 — cross-preset contrast, coverage, and translation gate
        run: pnpm run audit:preset-themes
      - name: CLI-003 — assert no unverified provenance lock entries
        run: pnpm run assert:no-unverified
      - name: BUILD-001 — verify no generated artifacts are stale
        run: |
          PATHSPEC=(registry/ 'packages/*/source/' 'packages/*/docs/accessibility/evidence.json')

          if git diff --quiet -- "${PATHSPEC[@]}"; then
            echo "Generated artifacts are current."
            exit 0
          fi

          echo "::group::Stale paths"
          git diff --stat -- "${PATHSPEC[@]}"
          echo "::endgroup::"

          echo "::group::Diff (first 200 lines)"
          git diff -- "${PATHSPEC[@]}" | head -200
          echo "::endgroup::"

          SUBSTANTIVE=$(git diff -U0 -- "${PATHSPEC[@]}" \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -cvE '"(lastGenerated|lastUpdated|generatedAt|signedAt)":' || true)

          if [ "$SUBSTANTIVE" -eq 0 ]; then
            echo "::error::Generated artifacts differ only in generation timestamps. That is a determinism regression in tools/registry-build.ts (withStableManifestStamps / withStableIndexStamp), not stale content — the stamps must be preserved when content is unchanged."
          else
            echo "::error::Generated artifacts are stale ($SUBSTANTIVE substantive changed lines). Run 'pnpm build && pnpm run report:a11y-evidence && pnpm run registry:build' and commit the changes."
          fi
          exit 1

      # Upload build output for downstream jobs to avoid rebuilding
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-dist
          path: |
            packages/*/dist
            apps/*/dist
            !apps/site/dist
          retention-days: 1

  # ─── Tests (consume build artifacts, no rebuild) ───────────────────────────────

  test-node:
    needs: build
    runs-on: solidiom-dfw-runner
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: |
          if [ "${{ inputs.affected_only }}" = "true" ]; then
            pnpm nx affected -t test --exclude=@solidiom/site
          else
            pnpm test
          fi
      - run: pnpm run test:tools

  test-browser:
    needs: build
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright (all browsers)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      - run: pnpm exec vitest run --config vitest.browser.config.ts
      - name: RECIPE-005 — computed-style parity across css/tailwind/unocss profiles
        run: pnpm run test:recipe-parity
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-traces
          path: test-results/
          retention-days: 7

  a11y-axe-scan:
    needs: build
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run executable axe accessibility scans
        run: pnpm run test:a11y
      - name: Publish stable per-primitive accessibility evidence
        run: pnpm run report:a11y-evidence
      - name: A11Y-004 — verify GA-status primitive accessibility evidence is current
        run: pnpm run a11y:coverage-gate
      - name: Generate axe report from the executed result artifact
        run: pnpm run report:axe
      - uses: actions/upload-artifact@v6
        with:
          name: axe-scan-results
          path: |
            artifacts/axe-results.json
            artifacts/a11y-evidence.json
            docs/axe-scan-results.md
          retention-days: 30

  # ─── CI-002: Site Check/Build/E2E ───────────────────────────────────────────

  site-check:
    needs: install
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @solidiom/site check
      - run: pnpm --filter @solidiom/site run boundaries
      - run: pnpm --filter @solidiom/site run i18n:validate

  site-build:
    needs: [install, site-check]
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build template previews
        run: pnpm --filter '@solidiom/template-*' build
      - name: Build and index static site
        run: pnpm --filter @solidiom/site build && pnpm --filter @solidiom/site search-index
      - name: REG-007 — verify every registry deliverable has exactly one valid route
        run: pnpm --filter @solidiom/site run registry-route-check
      - uses: actions/upload-artifact@v6
        with:
          name: site-dist
          path: apps/site/dist

  site-e2e:
    needs: site-build
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright (all browsers)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      - env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"
        run: pnpm --filter @solidiom/site run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: site-e2e-results
          path: test-results/site-e2e
          retention-days: 7

  # ─── CI-003: Visual/Lighthouse CI ──────────────────────────────────────────────

  # TEST-005: runs inside the pinned Playwright image so screenshot rendering is
  # reproducible. The image tag MUST track the @playwright/test version in
  # package.json. Blocking — baselines are captured in this environment.
  site-visual:
    needs: site-build
    runs-on: solidiom-dfw-runner
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      # Browsers ship with the image; no install needed.
      - env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"
        run: pnpm --filter @solidiom/site run test:visual
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: site-visual-diffs
          path: test-results/site-visual
          retention-days: 7

  site-lighthouse:
    needs: site-build
    runs-on: solidiom-dfw-runner
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - name: Install Chrome for Lighthouse
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Start static-site preview for Lighthouse
        run: pnpm --filter @solidiom/site preview --host 127.0.0.1 --port 4322 > /dev/null 2>&1 & for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4322/ > /dev/null && exit 0; sleep 1; done; exit 1
      - run: pnpm --filter @solidiom/site run lighthouse:json
      - uses: actions/upload-artifact@v6
        with:
          name: site-lighthouse-report
          path: apps/site/dist/reports
          retention-days: 30

  # ─── CLI-008: Offline create/install/typecheck/build/test smoke matrix ────────

  cli-smoke-create-prep:
    needs: build
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - name: Enable corepack (yarn)
        run: corepack enable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache/restore@v5
        id: snapshot-probe
        with:
          path: tools/offline-fixture/.registry-snapshot
          key: offline-registry-snapshot-${{ runner.os }}-${{ hashFiles('templates/*/package.json', 'pnpm-lock.yaml') }}
          lookup-only: true
      - name: CLI-008 — warm the offline registry snapshot (network required)
        if: steps.snapshot-probe.outputs.cache-hit != 'true'
        run: tools/offline-fixture/run-offline-test.sh --prep
      - uses: actions/cache/save@v5
        if: steps.snapshot-probe.outputs.cache-hit != 'true'
        with:
          path: tools/offline-fixture/.registry-snapshot
          key: offline-registry-snapshot-${{ runner.os }}-${{ hashFiles('templates/*/package.json', 'pnpm-lock.yaml') }}

  cli-smoke-create:
    needs: [build, cli-smoke-create-prep]
    runs-on: solidiom-dfw-runner
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - name: Enable corepack (yarn)
        run: corepack enable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache/restore@v5
        with:
          path: tools/offline-fixture/.registry-snapshot
          key: offline-registry-snapshot-${{ runner.os }}-${{ hashFiles('templates/*/package.json', 'pnpm-lock.yaml') }}
          fail-on-cache-miss: true
      - name: CLI-008 — cold-cache offline create/install/typecheck/build/test (${{ matrix.manager }})
        run: |
          mkdir -p artifacts
          tools/offline-fixture/run-offline-test.sh \
            --manager ${{ matrix.manager }} \
            --smoke-json-out artifacts/smoke-create-${{ matrix.manager }}.json
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: smoke-create-${{ matrix.manager }}-results
          path: artifacts/smoke-create-${{ matrix.manager }}.json
          retention-days: 7

  # ─── BETA-002 / G3: public-beta acceptance evidence ────────────────────────────

  beta-acceptance-report:
    needs: site-build
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - name: BETA-002 — static-build acceptance report
        run: pnpm run beta:acceptance:report

  beta-acceptance-e2e:
    needs: site-build
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright (all browsers)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      - name: BETA-002 — cross-browser acceptance matrix
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"
        run: pnpm run beta:acceptance:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: beta-acceptance-e2e-results
          path: test-results/beta-acceptance
          retention-days: 7

  # ─── Solid Matrix (single-tier smoke) ────────────────────────────────────────
  # Full multi-version matrix runs in solid-compat.yml on a nightly schedule.
  # This job gives CI a fast signal that the pinned Solid version works.

  test-solid-matrix:
    needs: build
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: pnpm test

  # ─── Gate Jobs (consolidated) ──────────────────────────────────────────────────

  catalog-gates:
    needs: build
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - run: pnpm run component:catalog-gate
      - run: pnpm run block:catalog-gate

  # VS-004's gate, the executable half of the G2 exit checklist.
  vertical-slice-gate:
    needs: [build, site-check]
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - name: VS-004 — vertical-slice gate (G2)
        run: pnpm run gate:vertical-slice

  # Consolidated phase gates: phase1 → phase2 → phase0 + phase3 all in one job.
  # Previously 4 separate jobs each rebuilding from scratch (~15 min saved).
  gates:
    needs: [typecheck, build, test-node, test-browser, a11y-axe-scan, site-e2e, catalog-gates]
    runs-on: solidiom-dfw-runner
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Phase 1 gate
        run: pnpm run gate:phase1
      - name: Phase 2 gate
        run: pnpm run gate:phase2
      - name: Phase 0 gate
        run: pnpm run gate:phase0
      - name: Phase 3 (library beta) gate
        run: pnpm run gate:phase3
      - uses: actions/upload-artifact@v6
        with:
          name: phase0-gate-output
          path: docs/phase0-gate-result.txt
          retention-days: 30
