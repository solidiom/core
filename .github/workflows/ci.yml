name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

  format:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test-node:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  test-browser:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: pnpm exec vitest run --config vitest.browser.config.ts
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-traces
          path: test-results/
          retention-days: 7

  test-solid-matrix:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        solid-tier: [low, mid, high]
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: node scripts/set-solid-version.mjs ${{ matrix.solid-tier }}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec nx run-many -t build --exclude=@solidiom/docs,@solidiom/docs-astro-poc,@solidiom/site
      - run: pnpm exec nx run-many -t test --exclude=@solidiom/tests-package-source-parity,@solidiom/site
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: pnpm exec vitest run --config vitest.browser.config.ts

  a11y-axe-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - name: Run executable axe accessibility scans
        run: pnpm run test:a11y
      - name: Generate axe report from the executed result artifact
        run: pnpm run report:axe
      - uses: actions/upload-artifact@v6
        with:
          name: axe-scan-results
          path: |
            artifacts/axe-results.json
            docs/axe-scan-results.md
          retention-days: 30

  # ─── CI-002: Site Check/Build/E2E ───────────────────────────────────────────

  site-check:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solidiom/site check
      - run: pnpm --filter @solidiom/site run boundaries
      - run: pnpm --filter @solidiom/site run route-parity

  site-build:
    needs: [install, site-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solidiom/site build
      - uses: actions/upload-artifact@v6
        with:
          name: site-dist
          path: apps/site/dist

  site-e2e:
    needs: site-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @solidiom/site run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: site-e2e-results
          path: test-results/site-e2e
          retention-days: 7

  # ─── CI-003: Visual/Lighthouse CI (Advisory Mode) ──────────────────────────────

  site-visual:
    needs: site-build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - run: npx playwright install --with-deps chromium
      - run: pnpm --filter @solidiom/site run test:visual
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: site-visual-diffs
          path: test-results/site-visual
          retention-days: 7

  site-lighthouse:
    needs: site-build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
      - name: Install Chrome for Lighthouse
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: pnpm --filter @solidiom/site run lighthouse:json
      - uses: actions/upload-artifact@v6
        with:
          name: site-lighthouse-report
          path: apps/site/lighthouse-report
          retention-days: 30

  # ─── Gate Jobs ─────────────────────────────────────────────────────────────────

  phase1-gate:
    needs: [typecheck, build, test-node, test-browser, a11y-axe-scan, site-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm run gate:phase1

  phase2-gate:
    needs: [phase1-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run gate:phase2

  phase0-gate:
    needs: [typecheck, build, test-node, test-browser, a11y-axe-scan, phase1-gate, phase2-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run gate:phase0
      - uses: actions/upload-artifact@v6
        with:
          name: phase0-gate-output
          path: docs/phase0-gate-result.txt
          retention-days: 30
