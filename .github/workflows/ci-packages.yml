name: CI (Packages)

# Package-target CI pipeline (split from the former monolithic ci.yml).
# Covers everything that builds, tests, and gates the workspace packages —
# excluding the site application, which lives in ci-site.yml.
#
#   - full_matrix=false: fast tier (format, typecheck, build, node tests on a
#     single Node version, Chromium browser tests) + quick gate.
#   - full_matrix=true:  comprehensive tier (Node 24+26 matrix, a11y, CLI smoke,
#     catalog gates) + full gate.
#
# Triggers are manual only for now. The `paths` filter below is dormant under
# workflow_dispatch; re-add a `push:`/`pull_request:` trigger to activate it.

on:
  workflow_dispatch:
    inputs:
      affected_only:
        description: "Run only affected packages (uses nx affected)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      full_matrix:
        description: "Run the full test matrix even on dispatch (like main push)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

  # Dormant under workflow_dispatch-only triggering. Documents the package
  # target boundary so re-enabling push/PR triggers scopes this workflow
  # correctly. To activate, move these keys under a `push:`/`pull_request:` key.
  #   paths:
  #     - "packages/**"
  #     - "tools/**"
  #     - "registry/**"
  #     - "pnpm-lock.yaml"
  #     - "package.json"
  #     - "nx.json"
  #     - "tsconfig*.json"
  #     - "vitest*.config.ts"
  #     - ".github/workflows/ci-packages.yml"
  #     - ".github/actions/setup/**"

concurrency:
  group: ci-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"
  NODE_OPTIONS: "--max-old-space-size=4096"
  NX_BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
  NX_HEAD: HEAD

jobs:
  # ─── Foundation ────────────────────────────────────────────────────────────────

  install:
    runs-on: self-hosted-dfw-flex
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            tests/*/node_modules
            tools/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

  # ─── Lint & Typecheck (always run, no build needed) ────────────────────────────

  format:
    needs: install
    runs-on: self-hosted-dfw-flex
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  typecheck:
    needs: install
    runs-on: self-hosted-dfw-flex
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  # ─── Build ────────────────────────────────────────────────────────────────────

  build:
    needs: install
    runs-on: self-hosted-dfw-flex
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build packages
        run: |
          if [ "${{ inputs.affected_only }}" = "true" ]; then
            pnpm nx affected -t build --exclude=@solidiom/site
          else
            pnpm nx run-many -t build --exclude=@solidiom/site
          fi

      # Post-build audits
      - name: REG-006 — verify registry catalog integrity
        run: node packages/cli/dist/bin.js verify --registry
      - name: Generate vertical-slice API artifacts
        # api:coverage-gate reads artifacts/api/*.json, which are gitignored and
        # wiped by the checkout's `git clean -ffdx`. Regenerate the three
        # vertical-slice primitives here (the full catalog run is memory-heavy
        # and unnecessary for this gate).
        run: |
          pnpm run api:generate -- --package dialog
          pnpm run api:generate -- --package combobox
          pnpm run api:generate -- --package data-table
      - name: API-004 — verify vertical-slice primitive API coverage
        run: pnpm run api:coverage-gate
      - name: Verify package src/source parity and exports
        run: pnpm run audit:package-source-parity
      - name: Verify generated theme output is current
        run: |
          pnpm run theme:emit:css:check
          pnpm run theme:emit:tailwind:check
          pnpm run theme:emit:unocss:check
      - name: Theme cross-output parity and contrast audit
        run: pnpm run audit:theme-parity
      - name: Cross-preset contrast, coverage, and translation gate
        run: pnpm run audit:preset-themes
      - name: Assert no unverified provenance lock entries
        run: pnpm run assert:no-unverified
      - name: Verify no generated artifacts are stale
        run: |
          PATHSPEC=(registry/ 'packages/*/source/' 'packages/*/docs/accessibility/evidence.json')
          if git diff --quiet -- "${PATHSPEC[@]}"; then
            echo "Generated artifacts are current."
            exit 0
          fi
          echo "::group::Stale paths"
          git diff --stat -- "${PATHSPEC[@]}"
          echo "::endgroup::"
          SUBSTANTIVE=$(git diff -U0 -- "${PATHSPEC[@]}" \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -cvE '"(lastGenerated|lastUpdated|generatedAt|signedAt)":' || true)
          if [ "$SUBSTANTIVE" -eq 0 ]; then
            echo "::error::Generated artifacts differ only in timestamps — determinism regression."
          else
            echo "::error::Generated artifacts are stale ($SUBSTANTIVE changed lines). Run 'pnpm build && pnpm run report:a11y-evidence && pnpm run registry:build' and commit."
          fi
          exit 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-dist
          path: |
            packages/*/dist
            apps/*/dist
            !apps/site/dist
          retention-days: 1

  # ─── Tests (Node) ─────────────────────────────────────────────────────────────
  # full_matrix=false: single Node version. full_matrix=true: matrix [24, 26].

  test-node:
    needs: build
    runs-on: self-hosted-dfw-flex
    strategy:
      matrix:
        node-version: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true') && fromJson('[24, 26]') || fromJson('[24]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          playwright: chromium
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - run: |
          if [ "${{ inputs.affected_only }}" = "true" ]; then
            pnpm nx affected -t test --exclude=@solidiom/site
          else
            pnpm test
          fi
      - run: pnpm run test:tools

  # ─── Tests (Browser) ──────────────────────────────────────────────────────────
  # Chromium only (full 3-browser matrix runs in nightly).

  test-browser:
    needs: build
    runs-on: self-hosted-dfw-flex
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: chromium
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - name: Browser component tests (Chromium)
        env:
          VITEST_BROWSERS: chromium
        run: pnpm exec vitest run --config vitest.browser.config.ts
      - name: Recipe parity test
        run: pnpm run test:recipe-parity
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-traces
          path: test-results/
          retention-days: 3

  # ─── Accessibility (full_matrix only) ──────────────────────────────────────────

  a11y-axe-scan:
    needs: build
    if: inputs.full_matrix == 'true'
    runs-on: self-hosted-dfw-flex
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: chromium
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - run: pnpm run test:a11y
      - run: pnpm run report:a11y-evidence
      - run: pnpm run a11y:coverage-gate
      - run: pnpm run report:axe
      - uses: actions/upload-artifact@v7
        with:
          name: axe-scan-results
          path: |
            artifacts/axe-results.json
            artifacts/a11y-evidence.json
            docs/axe-scan-results.md
          retention-days: 7

  # ─── CLI Smoke Tests (full_matrix only) ────────────────────────────────────────

  cli-smoke-create-prep:
    needs: build
    if: inputs.full_matrix == 'true'
    runs-on: self-hosted-dfw-flex
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - run: corepack enable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache/restore@v6
        id: snapshot-probe
        with:
          path: tools/offline-fixture/.registry-snapshot
          key: offline-registry-snapshot-${{ runner.os }}-${{ hashFiles('templates/*/package.json', 'pnpm-lock.yaml') }}
          lookup-only: true
      - name: Warm offline registry snapshot
        if: steps.snapshot-probe.outputs.cache-hit != 'true'
        run: tools/offline-fixture/run-offline-test.sh --prep
      - uses: actions/cache/save@v6
        if: steps.snapshot-probe.outputs.cache-hit != 'true'
        with:
          path: tools/offline-fixture/.registry-snapshot
          key: offline-registry-snapshot-${{ runner.os }}-${{ hashFiles('templates/*/package.json', 'pnpm-lock.yaml') }}

  cli-smoke-create:
    needs: [build, cli-smoke-create-prep]
    if: inputs.full_matrix == 'true'
    runs-on: self-hosted-dfw-flex
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - run: corepack enable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache/restore@v6
        with:
          path: tools/offline-fixture/.registry-snapshot
          key: offline-registry-snapshot-${{ runner.os }}-${{ hashFiles('templates/*/package.json', 'pnpm-lock.yaml') }}
          fail-on-cache-miss: true
      - name: Offline create/install/typecheck/build/test (${{ matrix.manager }})
        run: |
          mkdir -p artifacts
          tools/offline-fixture/run-offline-test.sh \
            --manager ${{ matrix.manager }} \
            --smoke-json-out artifacts/smoke-create-${{ matrix.manager }}.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-create-${{ matrix.manager }}-results
          path: artifacts/smoke-create-${{ matrix.manager }}.json
          retention-days: 3

  # ─── Catalog Gates (full_matrix only) ──────────────────────────────────────────

  catalog-gates:
    needs: build
    if: inputs.full_matrix == 'true'
    runs-on: self-hosted-dfw-flex
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - run: pnpm run component:catalog-gate
      - run: pnpm run block:catalog-gate

  # ─── Quality Gate (final) ──────────────────────────────────────────────────────
  # full_matrix=false: lightweight structural gate (format + typecheck + build + tests pass).
  # full_matrix=true: full durable release gate suite.

  gate:
    # `always()` lets the fast tier proceed when full-tier jobs are intentionally
    # skipped; the explicit result checks still prevent a gate after a failure.
    needs: [typecheck, build, test-node, test-browser, a11y-axe-scan, catalog-gates]
    if: >
      always() &&
      needs.typecheck.result == 'success' &&
      needs.build.result == 'success' &&
      needs.test-node.result == 'success' &&
      needs.test-browser.result == 'success' &&
      (inputs.full_matrix != 'true' ||
        (needs.a11y-axe-scan.result == 'success' &&
          needs.catalog-gates.result == 'success'))
    runs-on: self-hosted-dfw-flex
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: chromium
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .
      - name: Gate — quick
        if: inputs.full_matrix != 'true'
        run: pnpm run gate:quick
      - name: Gate — full
        if: inputs.full_matrix == 'true'
        run: pnpm run gate:full
