name: Release Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "templates/**"
      - "registry/**"
      - "packages/*/docs/**"
      - "docs/**"

concurrency:
  group: release-site-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"

jobs:
  deploy:
    runs-on: solidiom-dfw-runner
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Build all packages (site depends on primitive builds for source resolution)
      - run: pnpm nx run-many -t build --exclude=@solidiom/site

      # Build templates (site imports template metadata)
      - name: Build templates
        run: pnpm --filter '@solidiom/template-*' build

      # Site checks (boundaries + route parity)
      - name: Validate site structure
        run: |
          pnpm --filter @solidiom/site run boundaries
          pnpm --filter @solidiom/site run route-parity

      # Build site (skips i18n validation — GA gate, not beta gate)
      - name: Build site
        run: pnpm --filter @solidiom/site run build:deploy

      # Generate Pagefind search index
      - name: Generate search index
        run: pnpm --filter @solidiom/site search-index

      # Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy apps/site/dist \
            --project-name=solidiom-site \
            --branch=main \
            --commit-dirty=true
