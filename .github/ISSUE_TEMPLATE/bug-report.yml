name: Bug report
description: Report a reproducible problem in Solidiom.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproduction or a link to one.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Solidiom version
      placeholder: "For example, 0.1.0-beta.1"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node, package manager, and browser versions when relevant.
    validations:
      required: true
